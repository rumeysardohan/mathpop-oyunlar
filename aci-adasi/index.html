<title>Açı Adası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="5. sınıf: kesişen iki doğrunun oluşturduğu açılar. Keşif, görevler ve sınıf turnuvası.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Lavanta zemin, sabit simgeli üst şerit, beyaz kartlar; indigo kahraman paneli. Tek tema (marka). */
:root{
  --indigo:#2B17B0; --indigo-deep:#1C0D80; --lav:#EEE8FF; --lav-2:#DDD3FF; --lav-3:#C9BCFF;
  --card:#FFFFFF; --ink:#1B1450; --muted:#5E5796;
  --ok:#1CC8D8; --ok-ink:#04555D; --ok-soft:#D6F7FA;
  --bad:#F47A5E; --bad-ink:#8E2E17; --bad-soft:#FFE3DB;
  --sun:#FFD15C;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:88px; --r:22px;
  color-scheme:light;
}
html{font-size:clamp(16px,0.55vw + 12px,22px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--lav);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--lav);z-index:30}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
input,select{font:inherit;color:var(--ink)}

/* ---------- Sabit üst şerit + simge ---------- */
.topbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--bar);z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:rgba(238,232,255,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--lav-2)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.simge{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;flex:none;background:#fff;
  box-shadow:0 0 0 3px #fff,0 6px 16px rgba(43,23,176,.25)}
.handle{font-family:var(--display);font-weight:700;font-size:15px;color:var(--indigo);white-space:nowrap}
.hud{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:6px 14px;border-radius:999px;background:var(--card);
  font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--indigo);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--lav-2)}
.chip small{font-family:var(--body);font-weight:800;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip.urgent{background:var(--bad);color:#3A0C02}
.chip.urgent small{color:#3A0C02}
.iconbtn{width:52px;height:52px;border-radius:16px;background:var(--indigo);color:#fff;font-size:1.4rem;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--indigo-deep)}

/* ---------- Sayfa ---------- */
main{max-width:1240px;margin:0 auto;padding-top:calc(var(--bar) + 20px);padding-bottom:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:var(--r);padding:clamp(18px,2.4vw,32px);box-shadow:0 10px 30px rgba(43,23,176,.08)}
.eyebrow{font-weight:900;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 26px;border-radius:18px;
  background:var(--indigo);color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem;box-shadow:0 5px 0 var(--indigo-deep);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--indigo-deep)}
.btn.ok{background:var(--ok);color:#062F35;box-shadow:0 5px 0 #0E8E9A}
.btn.ghost{background:var(--card);color:var(--indigo);box-shadow:0 5px 0 var(--lav-3)}
.btn.coral{background:var(--bad);color:#3A0C02;box-shadow:0 5px 0 #C9553B}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- Ana ekran ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:stretch;background:var(--indigo);color:#fff;border-radius:32px;
  padding:clamp(22px,3.5vw,48px);overflow:hidden;position:relative}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.6rem);color:#fff;margin:12px 0 14px}
.hero h1 span{color:var(--ok)}
.hero p{font-size:1.15rem;color:#DCD4FF;max-width:30ch}
.hero .eyebrow{color:var(--sun)}
.hero .row{margin-top:26px}
.hero-dia{background:var(--lav);border-radius:26px;display:grid;place-items:center;padding:10px;min-width:0}
.hero-dia svg{max-height:340px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.station{background:var(--card);border-radius:var(--r);padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:180px;
  box-shadow:0 6px 0 var(--lav-2);transition:transform .15s}
.station:hover{transform:translateY(-3px)}
.station .num{font-family:var(--display);font-weight:800;font-size:1rem;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--lav);color:var(--indigo)}
.station h3{font-size:1.55rem;color:var(--indigo)}
.station p{color:var(--muted);font-size:.98rem}
.station .tag{margin-top:auto;font-weight:900;font-size:.8rem;color:var(--ok-ink)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;color:var(--muted);font-size:.9rem;align-items:center}
.linkbtn{background:none;color:var(--indigo);font-weight:800;min-height:48px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Diyagram ---------- */
.diagram{width:100%;display:block;user-select:none}
.diagram text{text-anchor:middle;dominant-baseline:central;font-family:var(--display);pointer-events:none;fill:var(--ink)}
.diagram .lbl{font-size:30px;font-weight:800}
.diagram .val{font-size:24px;font-weight:800}
.diagram .qm{font-size:34px;font-weight:800;fill:var(--indigo)}
.diagram .sector{cursor:pointer}
.diagram .sector:hover{filter:brightness(.92)}
.diagram .sector:focus-visible{outline:none;stroke:var(--sun);stroke-width:6}

/* ---------- Oyun ekranı ---------- */
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-size:clamp(1.7rem,3vw,2.4rem);color:var(--indigo);margin-top:4px}
.pill{display:inline-flex;align-items:center;min-height:40px;padding:4px 14px;border-radius:999px;background:var(--card);font-weight:900;font-size:.95rem;color:var(--indigo)}
.bar{height:12px;background:var(--lav-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.qcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"dia title" "dia ans";gap:8px 32px;align-items:start}
.q-title{grid-area:title}
.q-dia{grid-area:dia;background:var(--lav);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:6px}
.q-ans{grid-area:ans;min-width:0}
.q-title .eyebrow{color:var(--ok-ink)}
.q-title h3{font-size:clamp(1.5rem,2.6vw,2.1rem);margin-top:6px;color:var(--ink)}
.dia-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px}
.smallbtn{min-height:48px;padding:6px 16px;border-radius:14px;background:var(--card);color:var(--indigo);font-weight:800;font-size:.95rem}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.choices.one{grid-template-columns:1fr}
.choice{min-height:84px;padding:12px;border-radius:18px;background:var(--lav);border:3px solid var(--lav-2);font-family:var(--display);font-weight:800;font-size:2rem;color:var(--indigo);transition:transform .1s,border-color .1s}
.choice:hover:not(:disabled){border-color:var(--indigo)}
.choice:active:not(:disabled){transform:scale(.97)}
.choice.text{font-family:var(--body);font-size:1.15rem;text-align:left;min-height:72px;padding:14px 18px;line-height:1.35}
.choice.correct{background:var(--ok);border-color:var(--ok);color:#062F35}
.choice.wrong{background:var(--bad);border-color:var(--bad);color:#3A0C02}
.choice:disabled:not(.correct):not(.wrong){opacity:.55}
.fb{margin-top:16px;padding:16px 18px;border-radius:18px;font-size:1.08rem;line-height:1.5}
.fb strong{display:block;font-family:var(--display);font-size:1.35rem;margin-bottom:2px}
.fb.good{background:var(--ok-soft);color:var(--ok-ink)}
.fb.bad{background:var(--bad-soft);color:var(--bad-ink)}
.next{margin-top:16px}
.next .btn{width:100%}

/* ---------- Keşif ---------- */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tab{min-height:52px;padding:8px 18px;border-radius:16px;background:var(--card);color:var(--indigo);font-weight:800}
.tab[aria-pressed="true"]{background:var(--indigo);color:#fff}
.explore{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
.slider{width:100%;height:48px;accent-color:var(--indigo)}
.metrics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.metric{padding:8px 14px;border-radius:12px;background:var(--lav);font-weight:900;color:var(--indigo);font-variant-numeric:tabular-nums}
.side h3{font-size:1.8rem;color:var(--indigo);margin:6px 0 8px}
.tip{background:var(--lav);border-radius:16px;padding:14px 16px;margin:14px 0;font-weight:700}

/* ---------- Form / tablo ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:900;font-size:.95rem}
.field input,.field select{min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--lav-3);background:#fff;font-size:1.1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rules{background:var(--indigo);color:#fff}
.rules h3{font-size:1.6rem;color:#fff;margin:8px 0 12px}
.rules li{margin:6px 0}
.rules .muted{color:#CFC5FF}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px}
td{padding:14px 10px;border-top:2px solid var(--lav);font-size:1.05rem;white-space:nowrap}
tbody tr:first-child td{background:var(--ok-soft)}

/* ---------- Sonuç ---------- */
.result{max-width:820px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result .big-simge{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--ok)}
.result h2{font-size:clamp(2rem,4vw,3rem);color:var(--indigo)}
.cheer{font-size:1.25rem;font-weight:800;color:var(--ink);max-width:36ch}
.score-big{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,8vw,5.4rem);line-height:1;color:var(--indigo)}
.score-big small{font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stats div{background:var(--lav);border-radius:16px;padding:14px 8px}
.stats strong{display:block;font-family:var(--display);font-size:1.7rem;color:var(--indigo);font-variant-numeric:tabular-nums}
.result .row{justify-content:center}
.review-item{border-top:2px solid var(--lav);padding:14px 0}
.review-item h3{font-size:1.2rem;color:var(--indigo);margin:6px 0}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(28,13,128,.55);backdrop-filter:blur(4px);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:28px;padding:28px;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal h2{font-size:2rem;color:var(--indigo)}
.modal .row{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--indigo);color:#fff;
  padding:14px 22px;border-radius:16px;font-weight:800;max-width:calc(100% - 32px)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:45;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Duyarlı ---------- */
@media (max-width:900px){
  .hero,.explore,.setup{grid-template-columns:1fr}
  .stations{grid-template-columns:1fr}
  .station{min-height:0}
  .qcard{grid-template-columns:1fr;grid-template-areas:"title" "dia" "ans"}
  .q-dia .diagram{max-height:250px}
}
@media (max-width:520px){
  .handle{display:none}
  .chip{padding:6px 11px;font-size:1.05rem}
  .chip small{display:none}
  .two{grid-template-columns:1fr}
  .choice{min-height:76px;font-size:1.8rem}
  .stats strong{font-size:1.4rem}
  .btn{width:100%}
}
</style>

<main id="app"></main>
<div id="modalHost"></div>

<script>
'use strict';
const SIMGE=document.querySelector('.simge').src;
const $=s=>document.querySelector(s);
const app=$('#app');
const L='ABCD';
const store={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let settings=Object.assign({seconds:45,count:10,className:'5/A',event:'Turnuva 1',sound:true},store.get('aa-settings',{}));
let scores=store.get('aa-scores',[]);if(!Array.isArray(scores))scores=[];
let progress=Object.assign({explore:false,tasks:false},store.get('aa-progress',{}));
let G=null,screen='home',ticker=null,paused=false,last=0,heroAnim=0,heroToken=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function modal(html){$('#modalHost').innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;const b=$('#modalHost button');if(b)b.focus()}
function closeModal(){$('#modalHost').innerHTML=''}
function confetti(){if(reduce)return;const c=['#1CC8D8','#F47A5E','#FFD15C','#2B17B0'];for(let i=0;i<36;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'%';e.style.background=c[i%4];e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),3200)}}
let actx=null;
function beep(good){if(!settings.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='triangle';o.frequency.value=good?740:200;g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);o.start();o.stop(actx.currentTime+.26)}catch(e){}}

/* ---------- HUD ---------- */
function hud(on){$('#chipScore').hidden=!on;$('#chipTime').hidden=!on;$('#pauseBtn').hidden=!on}
function updateHud(){if(!G)return;$('#hudScore').textContent=G.score;const t=$('#hudTime'),chip=$('#chipTime');let urgent=false;
  if(G.mode==='tour'&&G.cfg.seconds>0){if(G.phase==='question'){t.textContent=Math.ceil(G.remaining)+' sn';urgent=G.remaining<=10}else t.textContent='—'}
  else t.textContent=fmt(G.total);chip.classList.toggle('urgent',urgent)}
function stopTicker(){clearInterval(ticker);ticker=null}
function startTicker(){stopTicker();last=performance.now();ticker=setInterval(tick,200)}
function tick(){const now=performance.now(),d=(now-last)/1000;last=now;if(paused||!G)return;G.total+=d;
  if(G.phase==='question'){G.qUsed+=d;if(G.mode==='tour'&&G.cfg.seconds>0){G.remaining=Math.max(0,G.remaining-d);if(G.remaining<=0){updateHud();submit(null);return}}}
  updateHud()}
function pauseGame(){if(!G||paused)return;paused=true;modal(`<div style="font-size:3rem">Ⅱ</div><h2>Oyun duraklatıldı</h2><p class="muted">Süre işlemiyor. Hazır olduğunda devam et.</p><button class="btn" onclick="resumeGame()">Devam et ▶</button>`)}
function resumeGame(){closeModal();paused=false;last=performance.now()}
$('#pauseBtn').onclick=pauseGame;
$('#homeBtn').onclick=()=>{if(G&&screen==='quiz'){paused=true;modal(`<h2>Ana ekrana dönülsün mü?</h2><p class="muted">Bu turun sonucu kaydedilmez.</p><div class="row"><button class="btn ghost" onclick="resumeGame()">Oyuna dön</button><button class="btn coral" onclick="closeModal();paused=false;home()">Ana ekran</button></div>`);return}home()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&screen==='quiz'&&G.mode==='tour')pauseGame()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalHost').innerHTML&&paused&&G)resumeGame()});

function setScreen(s){screen=s;cancelAnimationFrame(heroAnim);heroToken++;window.scrollTo(0,0);if(s!=='quiz'){stopTicker();hud(false)}}

/* ---------- Diyagram ---------- */
const SECT=['#D9CFFF','#B8F0F5','#FFD2C6','#FFE6A3'];
function pt(r,d){const a=d*Math.PI/180;return (240+r*Math.cos(a)).toFixed(1)+' '+(215+r*Math.sin(a)).toFixed(1)}
function xy(r,d){const a=d*Math.PI/180;return[(240+r*Math.cos(a)).toFixed(1),(215+r*Math.sin(a)).toFixed(1)]}
function diagram(theta,rot,o={}){
  const rays=[rot,rot+theta,rot+180,rot+180+theta],vals=[theta,180-theta,theta,180-theta];let s='';
  rays.forEach((a,i)=>{const b=i===3?rot+360:rays[i+1],m=xy(150,(a+b)/2),v=xy(78,(a+b)/2);
    let fill=SECT[i];if(o.mark===i)fill='#1CC8D8';if(o.focus===i)fill='#9C8BFF';
    const inter=o.tap&&o.tap.includes(i);
    s+=`<path d="M240 215L${pt(112,a)}A112 112 0 0 1 ${pt(112,b)}Z" fill="${fill}" stroke="#FFFFFF" stroke-width="3"${inter?` class="sector" tabindex="0" role="button" aria-label="${L[i]} açısını seç" data-sector="${i}"`:''}/>`;
    s+=`<text class="lbl" x="${m[0]}" y="${m[1]}">${L[i]}</text>`;
    if(o.showAll||o.known===i)s+=`<text class="val" x="${v[0]}" y="${v[1]}">${vals[i]}°</text>`;
    else if(o.target===i)s+=`<text class="qm" x="${v[0]}" y="${v[1]}">?</text>`});
  let lines=[rot,rot+theta].map(a=>`<path d="M${pt(198,a)}L${pt(198,a+180)}" stroke="#2B17B0" stroke-width="5" stroke-linecap="round"/>`).join('');

  return `<svg class="diagram" viewBox="0 0 480 430" role="img" aria-label="${label}O noktasında kesişen iki doğru A, B, C, D açılarını oluşturuyor."><circle cx="240" cy="215" r="190" fill="#FFFFFF"/>${s}${lines}<circle cx="240" cy="215" r="7" fill="#2B17B0"/><text x="262" y="240" style="font-size:20px;font-weight:800;fill:#2B17B0">O</text></svg>`}

const EXP=[
 {name:'Ters açılar',title:'Karşı karşıya duran açılar',desc:'Açı sürgüsünü kaydır ya da çizimi döndür. A ile C’yi, sonra B ile D’yi karşılaştır.',tip:'Önce sürgüyü hareket ettir.',q:'Doğrular nasıl dönerse dönsün hangisi hep doğrudur?',opts:['A ile C açılarının ölçüleri eşittir.','Dört açının ölçüleri her zaman eşittir.'],ok:0,rule:'Kesişen iki doğrunun oluşturduğu ters açıların ölçüleri eşittir.'},
 {name:'Komşu bütünler',title:'Yan yana duran açılar',desc:'A ve B’nin köşesi ortak, birer kolu ortak. Ölçülerini topla, sonra açıyı değiştirip yeniden topla.',tip:'Önce sürgüyü hareket ettir.',q:'Bu çizimde A ile B’nin ölçüleri toplamı kaç derecedir?',opts:['90°','180°'],ok:1,rule:'A ile B birlikte doğru açı oluşturur: toplamları 180°. Bunlara komşu bütünler açılar denir.'},
 {name:'Dik kesişim',title:'Özel durum: dik doğrular',desc:'A açısını 90° yap ve dört açının ölçüsüne bak.',tip:'“90° yap” düğmesine dokun.',q:'İki doğru dik kesişirse oluşan açılar nasıl olur?',opts:['Yalnızca ikisi dik açıdır.','Dördünün de ölçüsü 90° olur.'],ok:1,rule:'Dik kesişen iki doğru dört dik açı oluşturur; her biri 90°.'}];
let ex={tab:0,angle:55,rot:-25,touched:false,done:[false,false,false]};
function startExplore(){G=null;setScreen('explore');renderExplore()}
function renderExplore(){const e=EXP[ex.tab];
  app.innerHTML=`<div class="head"><div><span class="eyebrow">1 · Keşif İskelesi</span><h2>Doğruları oynat, sırrı bul</h2></div><span class="pill">${ex.done.filter(Boolean).length} / 3 keşif</span></div>
  <div class="tabs">${EXP.map((x,i)=>`<button class="tab" aria-pressed="${ex.tab===i}" onclick="ex.tab=${i};ex.touched=false;renderExplore()">${i+1}. ${x.name} ${ex.done[i]?'✓':''}</button>`).join('')}</div>

    <div class="row"><button class="smallbtn" style="background:var(--lav)" onclick="setAngle(90)">90° yap</button><button class="smallbtn" style="background:var(--lav)" onclick="ex.rot+=30;setAngle(ex.angle)">↻ Çizimi döndür</button></div>
    <div class="metrics" id="metrics"></div></section>
   <section class="card side"><span class="eyebrow">Dene · Gözle · Açıkla</span><h3>${e.title}</h3><p class="muted">${e.desc}</p>
    <p style="font-weight:800;margin-top:14px;font-size:1.15rem">${e.q}</p>
    <div class="choices one">${e.opts.map((o,i)=>`<button class="choice text" onclick="answerExplore(${i},this)">${o}</button>`).join('')}</div>
    <div id="exFb" aria-live="polite"></div></section></div>`;
  metrics()}
function metrics(){$('#metrics').innerHTML=`<span class="metric">A = C = ${ex.angle}°</span><span class="metric">B = D = ${180-ex.angle}°</span><span class="metric">A + B = 180°</span>`}
function setAngle(v){ex.angle=Number(v);ex.touched=true;$('#angle').value=ex.angle;$('#exDia').innerHTML=diagram(ex.angle,ex.rot,{showAll:true});$('#angleVal').textContent=ex.angle+'°';metrics()}
function answerExplore(i,btn){const e=EXP[ex.tab];
  if(!ex.touched||(ex.tab===2&&ex.angle!==90)){$('#exFb').innerHTML=`<div class="tip">☝ ${e.tip}</div>`;return}
  if(i!==e.ok){beep(false);btn.classList.add('wrong');$('#exFb').innerHTML=`<div class="fb bad"><strong>Bir daha bak.</strong>Çizimdeki ölçüleri karşılaştır.</div>`;return}

  const last=ex.done.every(Boolean);

/* ---------- Soru üretimi ---------- */
function seeded(seed){let a=2166136261;for(const c of seed){a^=c.charCodeAt(0);a=Math.imul(a,16777619)}return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const ANGLES=[35,40,45,50,55,60,65,70,75,80,100,105,110,115,120,125,130,135,140,145];
function makeQuestions(seed,count,learn){const r=seeded(seed),out=[];
  for(let i=0;i<count;i++){const type=learn?[0,1,0,1,2,3,2,2,5,4,3,5][i]:i%6;let theta=ANGLES[Math.floor(r()*ANGLES.length)];const rot=Math.floor(r()*12)*15-90;let q;
    if(type===0)q={target:2,answer:2,tap:[1,2,3],topic:'Ters açıları tanıma',prompt:'A açısının ters açısı hangisi? Şekilde ya da aşağıda dokun.',why:'A ile C karşı karşıyadır; kolları birbirinin uzantısıdır. Bu yüzden ters açılardır.',reason:'Kolları birbirinin uzantısıdır, karşı karşıya dururlar.',wrongs:['Ortak bir kolları vardır.','Ölçüleri toplamı 90°’dir.']};
    if(type===1)q={target:2,answer:theta,topic:'Ters açıların ölçüsü',prompt:`A açısı ${theta}° ise C açısı kaç derecedir?`,why:`A ile C ters açılardır. Ters açılar eşit olduğundan C = ${theta}°.`,reason:'Ters açıların ölçüleri eşittir.',wrongs:['Komşu açıların ölçüleri her zaman eşittir.','Kesişen doğrular hep dik açı oluşturur.']};
    if(type===2)q={target:1,answer:180-theta,topic:'Komşu bütünler',prompt:`A açısı ${theta}° ise B açısı kaç derecedir?`,why:`A ile B komşu bütünlerdir. B = 180° − ${theta}° = ${180-theta}°.`,reason:'A ile B birlikte doğru açı (180°) oluşturur.',wrongs:['Komşu açıların ölçüleri her zaman eşittir.','Ters açıların toplamı 180°’dir.']};
    if(type===3)q={target:2,answer:2,tap:[1,2,3],topic:'Komşu açıları tanıma',prompt:'B, C ve D’den hangisi A ile komşu DEĞİLDİR?',why:'A ile C’nin ortak kolu yoktur, bu yüzden komşu değildir; ters açılardır. B ve D, A ile birer kol paylaşır.',reason:'A ile ortak bir kolu yoktur.',wrongs:['A ile ortak köşesi yoktur.','Ölçüsü A’dan büyüktür.']};
    if(type===4){theta=90;q={target:1,answer:90,topic:'Dik kesişim',prompt:'Doğrular dik kesişiyor ve A = 90°. B açısı kaç derecedir?',why:'B = 180° − 90° = 90°. Dik kesişen iki doğru dört dik açı oluşturur.',reason:'Dik kesişen doğrular dört dik açı oluşturur.',wrongs:['Kesişen her iki doğru dik açı oluşturur.','Komşu açılar her zaman 45°’dir.']}}
    if(type===5)q={target:3,answer:180-theta,topic:'Açı dedektifi',prompt:`Robot diyor ki: “A = ${theta}° ise D de ${theta}° olur.” D’nin doğru ölçüsünü bul.`,why:`A ile D ters açı değil, komşu bütünlerdir. D = 180° − ${theta}° = ${180-theta}°.`,reason:'A ile D komşu bütünlerdir; toplamları 180°.',wrongs:['A ile D ters açılardır.','A ile D her zaman dik açıdır.']};
    q.type=type;q.theta=theta;q.rot=rot;
    if(!q.tap){const set=new Set([theta,180-theta,90,q.answer+10,q.answer-10,180-q.answer+10,Math.abs(90-theta),180].filter(v=>v>0&&v<=180&&v!==q.answer));q.options=shuffle([...set],r).slice(0,3);q.options.push(q.answer);shuffle(q.options,r)}else q.options=q.tap.slice();
    q.reasons=shuffle([q.reason,...q.wrongs],r);out.push(q)}
  return out}

/* ---------- Oyun akışı ---------- */
function startTasks(){G={mode:'learn',name:'Kâşif',questions:makeQuestions('learn-'+Date.now(),12,true),i:0,score:0,correct:0,reasonsOk:0,total:0,answers:[]};begin()}
function begin(){screen='quiz';hud(true);paused=false;startTicker();nextQuestion()}
function cur(){return G.questions[G.i]}
function diaOpts(q,phase){if(phase==='done')return{showAll:true,mark:q.target};return q.tap?{focus:0,tap:q.tap}:{known:0,target:q.target}}
function nextQuestion(){if(G.i>=G.questions.length){finish();return}
  G.phase='question';G.tries=0;G.rTries=0;G.qUsed=0;G.remaining=G.mode==='tour'?G.cfg.seconds:0;renderQuestion();updateHud()}
function renderQuestion(){const q=cur(),learn=G.mode==='learn',n=G.questions.length,ch=Math.floor(G.i/4);
  const chapters=['Ters Açılar Köprüsü','180° Kapısı','Dedektif Mağarası'];
  app.innerHTML=`<div class="head"><div><span class="eyebrow">${learn?'2 · Açı Tapınağı':'3 · Turnuva Kalesi · '+esc(G.cfg.className)}</span><h2>${learn?chapters[ch]:esc(G.name)}</h2></div><span class="pill">${learn?'Görev':'Soru'} ${G.i+1} / ${n}</span></div>
  <div class="bar"><span style="width:${G.i/n*100}%"></span></div>
  <section class="card qcard">
    <div class="q-title"><span class="eyebrow">${esc(q.topic)}</span><h3 id="qText">${q.prompt}</h3></div>
    <div class="q-dia"><div id="qDia">${diagram(q.theta,q.rot,diaOpts(q))}</div><div class="dia-tools"><span class="muted" style="font-size:.85rem;font-weight:700">Çizim dönse de ilişki değişmez.</span><button class="smallbtn" onclick="rotateQ()">↻ Döndür</button></div></div>
    <div class="q-ans"><div class="choices" id="choices">${q.options.map(v=>`<button class="choice" data-v="${v}" onclick="submit(${v})">${q.tap?L[v]:v+'°'}</button>`).join('')}</div>
      <div id="fb" aria-live="polite"></div><div class="next" id="next"></div></div>
  </section>`}
function rotateQ(){const q=cur();q.rot+=30;$('#qDia').innerHTML=diagram(q.theta,q.rot,diaOpts(q,G.phase==='question'?'':'done'))}
function hint(q){return q.type<=1?'Ters açılar karşı karşıya durur ve ölçüleri eşittir.':q.type===3?'Komşu açılar köşeyi ve bir kolu paylaşır.':q.type===4?'Dik açının ölçüsü 90°’dir.':'Yan yana duran iki açı birlikte 180° eder.'}
function submit(v){if(!G||G.phase!=='question'||paused)return;const q=cur(),good=v===q.answer,learn=G.mode==='learn';beep(good);
  if(!good&&learn&&v!==null){G.tries++;const b=$(`#choices [data-v="${v}"]`);if(b){b.classList.add('wrong');b.disabled=true}
    $('#fb').innerHTML=`<div class="fb bad"><strong>Bir daha dene!</strong>${hint(q)}</div>`;return}
  G.phase='answered';let pts=0,bonus=0;
  if(good){if(learn){pts=G.tries?50:100;if(!G.tries)G.correct++}else{bonus=G.cfg.seconds>0?Math.floor(10*G.remaining/G.cfg.seconds):0;pts=100+bonus;G.correct++}}
  G.score+=pts;G.answers.push({topic:q.topic,prompt:q.prompt,why:q.why,correct:learn?G.tries===0:good,reasonOk:false});
  document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;const bv=Number(b.dataset.v);if(bv===q.answer)b.classList.add('correct');else if(bv===v)b.classList.add('wrong')});
  $('#qDia').innerHTML=diagram(q.theta,q.rot,diaOpts(q,'done'));
  const head=good?`Doğru! +${pts} puan`:v===null?'Süre doldu.':'Bu sefer olmadı.';
  $('#fb').innerHTML=`<div class="fb ${good?'good':'bad'}"><strong>${head}</strong>${q.why}</div>`;
  $('#next').innerHTML=good?`<button class="btn" onclick="askReason()">Peki neden? →</button>`:`<button class="btn" onclick="advance()">Sonraki soru →</button>`;
  updateHud();if(good&&!reduce)$('#next button').scrollIntoView({block:'nearest',behavior:'smooth'})}
function askReason(){if(G.phase!=='answered')return;G.phase='reason';const q=cur();
  $('#qText').textContent='Bu sonuca neden ulaştın?';$('#fb').innerHTML='';$('#next').innerHTML='';
  const c=$('#choices');c.classList.add('one');c.innerHTML=q.reasons.map((r,i)=>`<button class="choice text" data-r="${i}" onclick="answerReason(${i})">${r}</button>`).join('');updateHud();
  if(!reduce)$('#qText').scrollIntoView({block:'nearest',behavior:'smooth'})}
function answerReason(i){if(G.phase!=='reason'||paused)return;const q=cur(),good=q.reasons[i]===q.reason,learn=G.mode==='learn';beep(good);
  if(!good&&learn){G.rTries++;const b=$(`#choices [data-r="${i}"]`);b.classList.add('wrong');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad"><strong>Gerekçeyi yeniden düşün.</strong>${q.why}</div>`;return}
  G.phase='reasoned';let pts=0;if(good){pts=learn&&G.rTries?25:50;G.score+=pts;if(!learn||!G.rTries){G.reasonsOk++;G.answers.at(-1).reasonOk=true}}
  document.querySelectorAll('#choices button').forEach((b,j)=>{b.disabled=true;if(q.reasons[j]===q.reason)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});
  $('#fb').innerHTML=`<div class="fb ${good?'good':'bad'}"><strong>${good?'Gerekçe de doğru! +'+pts+' puan':'Doğru gerekçe şuydu:'}</strong>${q.reason}</div>`;
  $('#next').innerHTML=`<button class="btn" onclick="advance()">${G.i===G.questions.length-1?'Sonucu gör ★':'Devam et →'}</button>`;updateHud()}
function advance(){G.i++;
  if(G.mode==='learn'&&G.i%4===0){const n=G.i/4;confetti();G.phase='gate';
    modal(`<img src="${SIMGE}" alt="" style="width:88px;height:88px;border-radius:50%"><h2>${n}. kapı açıldı!</h2><p class="muted">${['Ters açılar köprüsünü geçtin.','180° kapısını açtın.','Dedektif görevlerini çözdün.'][n-1]}</p><button class="btn ok" onclick="closeModal();nextQuestion()">${n===3?'Sonucu gör ★':'Sonraki bölge →'}</button>`);return}
  nextQuestion()}

/* ---------- Sonuç ---------- */
function cheer(p){return p>=.9?'Harikasın! Kesişen doğruların dilini artık çok iyi konuşuyorsun.':p>=.7?'Çok iyi gidiyorsun! Bir tur daha, tam ustalaşacaksın.':p>=.4?'Güzel başlangıç! Çözümlere göz at, sonra yeniden dene.':'Her deneme seni güçlendirir. Haydi, bir tur daha!'}

  else{scores.push({name:g.name,score:g.score,correct:g.correct,reasons:g.reasonsOk,count:n,time:Math.round(g.total),group:groupKey(g.cfg),cfg:g.cfg,date:new Date().toISOString()});store.set('aa-scores',scores)}
  screen='result';hud(false);$('#chipScore').hidden=false;$('#chipTime').hidden=false;$('#hudTime').textContent=fmt(g.total);$('#chipTime').classList.remove('urgent');window.scrollTo(0,0);confetti();
  app.innerHTML=`<section class="card result">
    <img class="big-simge" src="${SIMGE}" alt="MathPopWithRu simgesi">

    <p class="cheer">${cheer(p)}</p>
    <div class="score-big">${g.score}<small> puan</small></div>
    <div class="stats"><div><strong>${g.correct}/${n}</strong><span class="muted">${learn?'İlk denemede doğru':'Doğru cevap'}</span></div><div><strong>${g.reasonsOk}/${n}</strong><span class="muted">Doğru gerekçe</span></div><div><strong>${fmt(g.total)}</strong><span class="muted">Toplam süre</span></div></div>
    <div class="row"><button class="btn ok" onclick="replay()">↻ Tekrar oyna</button>${learn?'<button class="btn" onclick="tournamentSetup()">Turnuvaya katıl →</button>':'<button class="btn" onclick="showBoard()">Sınıf tablosu</button>'}</div>
    <div class="row"><button class="btn ghost" onclick="showReview()">Çözümleri incele</button><button class="btn ghost" onclick="home()">Ana ekran</button></div>
  </section>`}
function replay(){if(!G)return home();if(G.mode==='learn')startTasks();else startTour(G.name,G.cfg)}
function showReview(){const g=G;if(!g)return home();setScreen('review');
  app.innerHTML=`<div class="head"><div><span class="eyebrow">Keşif defteri</span><h2>Çözümler</h2></div><button class="btn ghost" onclick="replay()">↻ Tekrar oyna</button></div>

/* ---------- Turnuva ---------- */
function groupKey(c){return JSON.stringify([c.className,c.event,c.seconds,c.count])}
function tournamentSetup(){G=null;setScreen('setup');
  app.innerHTML=`<div class="head"><div><span class="eyebrow">3 · Turnuva Kalesi</span><h2>Sınıfın hazır mı?</h2></div></div>
  <div class="setup"><section class="card"><form id="tourForm">
    <div class="field"><label for="pName">Öğrenci ya da takım adı</label><input id="pName" maxlength="30" placeholder="Örn. Açı Avcıları" autocomplete="off" required></div>
    <div class="two"><div class="field"><label for="pClass">Sınıf / şube</label><input id="pClass" maxlength="20" value="${esc(settings.className)}"></div>
    <div class="field"><label for="pEvent">Turnuva adı</label><input id="pEvent" maxlength="30" value="${esc(settings.event)}"></div></div>
    <div class="two"><div class="field"><label for="pSec">Soru başına süre</label><select id="pSec">${[0,20,30,45,60,90].map(v=>`<option value="${v}"${settings.seconds===v?' selected':''}>${v?v+' saniye':'Süresiz'}</option>`).join('')}</select></div>
    <div class="field"><label for="pCount">Soru sayısı</label><select id="pCount">${[6,10,12,18].map(v=>`<option${settings.count===v?' selected':''}>${v}</option>`).join('')}</select></div></div>
    <button class="btn ok" type="submit" style="width:100%">Turnuvayı başlat →</button></form></section>
  <aside class="card rules"><span class="eyebrow" style="color:var(--sun)">Puanlama</span><h3>Bilginle öne geç</h3>
    <ul style="padding-left:20px;margin:0;font-weight:700"><li>Doğru cevap: 100 puan</li><li>Doğru gerekçe: 50 puan</li><li>Hız bonusu: 0–10 puan</li></ul>
    <p class="muted" style="margin-top:14px">Aynı sınıf, turnuva adı, süre ve soru sayısı herkese aynı soruları getirir. Yeni sorular için turnuva adını değiştir. Sonuçlar bu cihazda saklanır.</p></aside></div>`;
  $('#tourForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#pName').value.trim();if(!name){toast('Bir ad yaz.');$('#pName').focus();return}
    settings=Object.assign(settings,{className:$('#pClass').value.trim()||'5/A',event:$('#pEvent').value.trim()||'Turnuva 1',seconds:Number($('#pSec').value),count:Number($('#pCount').value)});store.set('aa-settings',settings);
    startTour(name,{className:settings.className,event:settings.event,seconds:settings.seconds,count:settings.count})})}
function startTour(name,cfg){G={mode:'tour',name,cfg:{...cfg},questions:makeQuestions(groupKey(cfg),cfg.count,false),i:0,score:0,correct:0,reasonsOk:0,total:0,answers:[]};begin()}
function showBoard(key){const fallback=groupKey(settings);key=key||fallback;setScreen('board');
  const groups=[...new Set([key,...scores.map(s=>s.group)])];
  app.innerHTML=`<div class="head"><div><span class="eyebrow">Sınıf tablosu</span><h2>Liderlik tablosu</h2></div><button class="btn ok" onclick="tournamentSetup()">Yeni oyuncu →</button></div>
  <section class="card"><div class="field" style="max-width:560px"><label for="grp">Sınıf ve turnuva</label><select id="grp">${groups.map((g,i)=>{let c;try{c=JSON.parse(g)}catch(e){return''}return`<option value="${i}"${g===key?' selected':''}>${esc(c[0])} · ${esc(c[1])} · ${c[3]} soru · ${c[2]?c[2]+' sn':'süresiz'}</option>`}).join('')}</select></div>
  <div id="tbl"></div><p class="muted" style="margin-top:14px;font-size:.9rem">Tablo yalnızca bu cihazdaki turları gösterir. Puan, sonra doğru sayısı, sonra süreye göre sıralanır.</p></section>`;
  $('#grp').onchange=()=>table(groups[Number($('#grp').value)]);table(key)}
function table(key){const rows=scores.filter(s=>s.group===key).sort((a,b)=>b.score-a.score||b.correct-a.correct||a.time-b.time);
  $('#tbl').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Sıra</th><th>Ad</th><th>Puan</th><th>Doğru</th><th>Gerekçe</th><th>Süre</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><strong>${esc(s.name)}</strong></td><td><strong>${s.score}</strong></td><td>${s.correct}/${s.count}</td><td>${s.reasons}/${s.count}</td><td>${fmt(s.time)}</td></tr>`).join('')}</tbody></table></div>`
  :`<div style="text-align:center;padding:30px 10px"><img src="${SIMGE}" alt="" style="width:80px;height:80px;border-radius:50%"><h3 style="color:var(--indigo);margin-top:10px">İlk kâşif bekleniyor</h3><p class="muted">Bir turnuva turu bitince sonuç burada görünür.</p></div>`}

home();
</script>

</body></html>
