<title>Deneysel Olasılık Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Düzen: sabit üst şerit (simge + puan/süre), altında tek sütun beyaz atölye kartı; marka görünümü tek tema */
:root{
  --indigo:#2B17B0; --indigo-deep:#1E0F86; --lav:#EEE8FF; --card:#FFFFFF;
  --turq:#1CC8D8; --coral:#F47A5E; --ink:#1B1240; --muted:#5B5384;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar-h:84px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--indigo);color:var(--ink);font-family:var(--body);font-size:clamp(17px,1.2vw + 12px,24px);line-height:1.45;
  background-image:radial-gradient(circle at 12% 88%,rgba(28,200,216,.18) 0 14%,transparent 15%),radial-gradient(circle at 92% 20%,rgba(244,122,94,.16) 0 10%,transparent 11%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--indigo-deep)}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--turq);outline-offset:3px}

/* ÜST ŞERİT */
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;height:var(--bar-h);
  background:var(--indigo-deep);box-shadow:0 4px 0 rgba(0,0,0,.18);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;min-width:0}
.brand img{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#fff;display:block;flex:0 0 auto}
.brand span{color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;opacity:.9}
.hud{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:700;
  font-size:clamp(16px,1vw + 12px,24px);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.pill b{color:var(--turq)}
.pill.score b{color:#FFD9CF}
@media (max-width:520px){.brand span{display:none}.pill{padding:5px 10px}}

main{min-height:100%;padding-top:calc(var(--bar-h) + 20px);padding-bottom:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}

/* GİRİŞ */
.hero{color:#fff;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hero .logo{width:min(520px,100%);background:#fff;border-radius:22px;padding:10px 16px}
.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.72em;color:var(--turq)}
.hero h1{font-size:clamp(34px,4vw + 16px,64px);font-weight:800}
.hero p{margin:0;max-width:60ch;color:#DCD3FF}
.big{background:var(--turq);color:var(--ink);border:0;border-radius:20px;padding:18px 28px;font-family:var(--display);font-weight:800;
  font-size:clamp(22px,1.2vw + 16px,32px);box-shadow:0 6px 0 #0E8E9A;min-height:64px;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0E8E9A}
.big.alt{background:#fff;box-shadow:0 6px 0 #B9AEEA}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.st{background:var(--card);border:0;border-radius:22px;padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;
  box-shadow:0 6px 0 #B9AEEA;color:var(--ink);transition:transform .1s}
.st:active{transform:translateY(4px);box-shadow:0 2px 0 #B9AEEA}
.st .code{font-family:var(--display);font-weight:800;color:var(--indigo);font-size:1.05em}
.st .name{font-family:var(--display);font-weight:700;font-size:1.15em;line-height:1.15}
.st .sub{color:var(--muted);font-size:.85em}
.st .n{margin-top:auto;font-size:.78em;font-weight:800;color:var(--indigo);background:var(--lav);border-radius:999px;padding:2px 10px;align-self:flex-start}

/* SORU KARTI */
.card{background:var(--card);border-radius:28px;padding:clamp(18px,2.5vw,36px);box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tag{background:var(--lav);color:var(--indigo);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.8em}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:50%;background:#DDD5FF;display:block}
.prog i.ok{background:var(--turq)} .prog i.no{background:var(--coral)} .prog i.now{background:var(--indigo)}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,1.6vw + 16px,40px);line-height:1.2;color:var(--ink)}
.hint{color:var(--muted);font-size:.9em;margin-top:-8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--lav);border:3px solid transparent;border-radius:20px;min-height:76px;padding:12px 16px;font-family:var(--display);font-weight:700;
  font-size:clamp(22px,1.2vw + 16px,34px);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;transition:transform .1s,background .15s}
.opt:hover{border-color:var(--indigo)}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--turq);color:#fff;border-color:var(--turq)}
.opt.no{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.no){opacity:.55}

/* kesir & devir */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.82em;margin:0 .08em}
.fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em .06em}
.fr>span:last-child{padding:.06em .12em 0}
.dv{text-decoration:overline;text-decoration-thickness:.07em}

/* sayı doğrusu */
.nl{position:relative;width:100%;height:150px;margin-top:6px}
.nl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.nl .hit{position:absolute;top:22px;height:84px;transform:translateX(-50%);border:0;background:transparent;border-radius:14px;padding:0}
.nl .hit:hover{background:rgba(43,23,176,.08)}
.nl .dot{position:absolute;top:50px;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}

/* sıralama */
.slots{display:flex;flex-wrap:wrap;gap:10px;min-height:84px;padding:12px;border:3px dashed #C9BEFA;border-radius:20px;align-items:center}
.slots .ph{color:var(--muted);font-size:.9em}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:var(--lav);border:3px solid var(--indigo);border-radius:18px;min-width:84px;min-height:68px;padding:8px 16px;font-family:var(--display);
  font-weight:800;font-size:clamp(22px,1vw + 16px,32px);color:var(--ink)}
.chip.in{background:var(--indigo);color:#fff}
.chip.ok{background:var(--turq);border-color:var(--turq);color:#fff}
.chip.no{background:var(--coral);border-color:var(--coral);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ghost{background:transparent;border:3px solid var(--indigo);color:var(--indigo);border-radius:16px;padding:10px 18px;font-weight:800;min-height:60px}
.go{background:var(--indigo);color:#fff;border:0;border-radius:16px;padding:10px 24px;font-family:var(--display);font-weight:800;font-size:1.1em;min-height:60px}
.go[disabled]{opacity:.4}

/* geri bildirim */
.fb{border-radius:20px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.fb.ok{background:#DDF7FA;border:3px solid var(--turq)}
.fb.no{background:#FDE7E1;border:3px solid var(--coral)}
.fb .msg{min-width:0;flex:1 1 280px}
.fb .msg strong{font-family:var(--display);font-size:1.15em;display:block}
.fb.ok strong{color:#0B8794} .fb.no strong{color:#C24A2E}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}

/* sonuç */
.res{align-items:center;text-align:center}
.res .face{width:120px;height:120px;border-radius:50%;border:5px solid var(--turq);background:#fff}
.res h2{font-size:clamp(32px,3vw + 16px,56px);color:var(--indigo)}
.res .cheer{font-size:1.1em;max-width:44ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.stat{background:var(--lav);border-radius:18px;padding:10px 20px;min-width:130px}
.stat b{display:block;font-family:var(--display);font-size:1.8em;color:var(--indigo);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8em;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.break{width:100%;display:grid;gap:8px;text-align:left}
.brow{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border-radius:14px;background:#F7F4FF;font-weight:700}
.brow em{font-style:normal;color:var(--indigo);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{color:#BFB3FF;font-size:.75em;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lv{border-radius:999px;padding:4px 12px;font-weight:800;font-size:.8em;white-space:nowrap}
.lv i{font-style:normal;letter-spacing:.05em}
.lv.l1{background:#DDF7FA;color:#0B8794}.lv.l2{background:#FFF1D6;color:#9A6200}.lv.l3{background:#FDE7E1;color:#C24A2E}
.st.skill{border:3px solid var(--coral);box-shadow:0 6px 0 #C9573C}
.st.skill .code{color:#C24A2E}
.skillcard{border-top:8px solid var(--coral)}
.tblw{overflow-x:auto;margin-top:14px}
.tbl{font-family:var(--body);font-size:clamp(15px,.6vw + 12px,21px);font-weight:700;border-collapse:collapse;min-width:280px}
.tbl th,.tbl td{padding:8px 14px;border:2px solid #DDD5FF;text-align:left;font-variant-numeric:tabular-nums}
.tbl th{background:var(--lav);color:var(--indigo)}
.work{font-family:var(--body);font-size:clamp(16px,.6vw + 13px,22px);font-weight:700;background:var(--lav);border-radius:16px;padding:12px 16px;margin-top:12px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.nlab{position:absolute;top:78px;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:clamp(20px,1vw + 14px,30px);color:#2B17B0}
.chip.miss{background:#fff;border:3px dashed var(--turq);color:#0B8794}
.chip.off{opacity:.45}
.chip[disabled]{cursor:default}
.stat.small{min-width:110px;padding:6px 14px}.stat.small b{font-size:1.3em}
.chart{display:block;width:100%;max-width:560px;height:auto;margin-top:14px;background:#fff;border:2px solid #EEE8FF;border-radius:16px;padding:6px}
.tly{font-family:var(--body);font-weight:800;letter-spacing:3px;color:var(--indigo);display:inline-flex;gap:12px;flex-wrap:wrap}
.t5{position:relative;display:inline-block}
.t5::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:3px solid var(--coral);transform:rotate(-18deg)}
</style>

<script>
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const D=(pre,rep)=>`${pre}<span class="dv">${rep}</span>`;
const M="−";
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sgn=()=>Math.random()<.5?-1:1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function fr(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
const add=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>fr(a.n*b.n,a.d*b.d),dvd=(a,b)=>fr(a.n*b.d,a.d*b.n);
const val=f=>f.n/f.d,neg=f=>fr(-f.n,f.d);
const I=n=>n<0?M+(-n):String(n);
const P=n=>n<0?`(${I(n)})`:I(n);
function Dec(x){const r=Math.round(x*10000)/10000;const s=Math.abs(r).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");return (r<0?M:"")+s.replace(".",",")}
const term=f=>{let d=f.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1};
const FH=f=>f.d===1?I(f.n):(f.n<0?M:"")+F(Math.abs(f.n),f.d);
const VH=f=>f.d===1?I(f.n):term(f)?Dec(val(f)):FH(f);
const sym=f=>term(f)?"=":"≈";
const AP=f=>term(f)?Dec(val(f)):Dec(Math.round(val(f)*100)/100);
const iv=n=>({h:I(n),v:n}),dv=x=>({h:Dec(x),v:Math.round(x*1e6)/1e6}),fo=f=>({h:VH(f),v:val(f)}),ff=f=>({h:FH(f),v:val(f)});
function decExp(n,d){const ip=Math.floor(n/d);let r=n%d;const digs=[],seen={};let rs=-1;
  while(r!==0&&digs.length<40){if(seen[r]!==undefined){rs=seen[r];break}seen[r]=digs.length;r*=10;digs.push(Math.floor(r/d));r%=d}
  return{ip,digs,rs}}
function expH(e,over=true){if(!e.digs.length)return String(e.ip);if(e.rs<0)return e.ip+","+e.digs.join("");
  const a=e.digs.slice(0,e.rs).join(""),b=e.digs.slice(e.rs).join("");return e.ip+","+a+(over?D("",b):b)}
function MC(q,c,ds,e,fill){const norm=x=>typeof x==="string"?{h:x}:x;c=norm(c);const out=[c];
  const ok=x=>!out.some(o=>o.h===x.h||(o.v!==undefined&&x.v!==undefined&&Math.abs(o.v-x.v)<1e-9));
  for(const d of ds.map(norm))if(out.length<4&&ok(d))out.push(d);
  let g=0;while(out.length<4&&fill&&g++<60){const d=norm(fill());if(ok(d))out.push(d)}
  return{t:"mc",q,o:out.map(o=>o.h),a:0,e}}
const NAMES=["Elif","Ali","Zeynep","Mert","Ayşe","Can","Defne","Emir","Ece","Kerem","Nil","Arda"];
const tbl=(head,rows)=>`<div class="tblw"><table class="tbl"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;

const L=a=>a.join(", ");

function bar(labels,vals,title){const W=400,H=250,l=34,b=44,t=14,r=10,mx=Math.max(...vals.filter(v=>v!==null)),top=Math.max(4,Math.ceil(mx/2)*2),ch=H-b-t,cw=W-l-r,bw=cw/labels.length,step=top>14?2:1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">`;
  for(let v=0;v<=top;v+=step){const y=t+ch-ch*v/top;s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="#DDD5FF" stroke-width="${v%(2*step)?0.7:1.3}"/>`;if(v%(2*step)===0)s+=`<text x="${l-6}" y="${y+4}" text-anchor="end" font-size="12" fill="#5B5384">${v}</text>`}
  labels.forEach((lb,i)=>{const x=l+i*bw+bw*.18,w=bw*.64;

    else{const h=ch*vals[i]/top;s+=`<rect x="${x}" y="${t+ch-h}" width="${w}" height="${h}" rx="4" fill="${PAL[i%PAL.length]}"/>`}
    s+=`<text x="${x+w/2}" y="${H-b+18}" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1240">${lb}</text>`});
  return s+`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#5B5384">${title}</text></svg>`}
function dots(labels,cnt,title){const mx=Math.max(...cnt,4),W=400,colW=(W-20)/labels.length,H=mx*20+64;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}"><line x1="10" x2="${W-10}" y1="${H-44}" y2="${H-44}" stroke="#2B17B0" stroke-width="2"/>`;
  labels.forEach((lb,i)=>{const cx=10+colW*(i+.5);for(let k=0;k<cnt[i];k++)s+=`<circle cx="${cx}" cy="${H-56-k*20}" r="7.5" fill="#2B17B0"/>`;
    s+=`<text x="${cx}" y="${H-24}" text-anchor="middle" font-size="14" font-weight="800" fill="#1B1240">${lb}</text>`});
  return s+`<text x="${W/2}" y="${H-5}" text-anchor="middle" font-size="12" fill="#5B5384">${title}</text></svg>`}
const tally=n=>{let s="";for(let i=0;i<Math.floor(n/5);i++)s+=`<span class="t5">||||</span>`;if(n%5)s+=`<span class="t1">${"|".repeat(n%5)}</span>`;return`<span class="tly">${s}</span>`};

  const f=fr(p,100);return MC(`%${p} değerinin en sade kesir hâli hangisidir?`,ff(f),[ff(fr(f.d,f.n)),ff(sub(fr(1),f)),fv(p,1000)],`%${p} = ${F(p,100)} = ${FH(f)}`,()=>ff(fr(R(1,9),R(10,20))))};
G.nlSpec=()=>{const d=pick([4,5,10]),n=R(1,d-1),f=fr(n,d),st=R(0,2),h=st===0?FH(f):st===1?pc(val(f)*100):Dec(val(f));

G.twoTF=()=>{const[n1,n2]=shuffle(NAMES).slice(0,2);let a,b;do{a=R(5,15);b=R(5,15)}while(a===b);

  `${A}: ${F(s1,n1)} = %${Dec(s1*100/n1)}. ${B}: ${F(s2,n2)} = %${Dec(s2*100/n2)}. Başarı sayısına değil, göreli sıklığa bakılır.`)};

G.marble=()=>{const T=pick([20,25,50]),cs=shuffle(COLORS).slice(0,4);let v;do{v=[R(1,T/2),R(1,T/2),R(1,T/2)];v.push(T-sum(v))}while(v[3]<1);const k=R(0,3),p=v[k]*100/T;
  return MC(`Torbadan misket çekip rengine bakarak geri atma deneyi ${T} kez yapıldı. Rastgele çekilen bir misketin ${cs[k].toLowerCase()} olma olayının deneysel olasılığı yüzde kaçtır?${tbl(["Renk",...cs],[["Çekilme sıklığı",...v.map(String)]])}`,
  pcv(p),cs.map((_,i)=>i).filter(i=>i!==k).map(i=>pcv(v[i]*100/T)),`${F(v[k],T)} = %${Dec(p)}`,()=>pcv(R(1,19)*5))};
G.boxTrap=()=>{const r=R(3,7),b=R(2,4),y=R(1,2),cs=["kırmızı","mavi","sarı"],T=20;let fr_,fb;do{fr_=R(6,12);fb=R(3,8)}while(fr_+fb>=T);const fy=T-fr_-fb;
  return MC(`Bir kutuda renkleri dışında özdeş ${r} kırmızı, ${b} mavi ve ${y} sarı top var. Topu çekip rengine bakarak geri atma deneyi ${T} kez yapıldı: ${fr_} kez kırmızı, ${fb} kez mavi geldi. Çekilen topun sarı olma olayının deneysel olasılığı kaçtır?`,
  ff(fr(fy,T)),[ff(fr(y,r+b+y)),ff(fr(y,T)),ff(fr(fr_+fb,T))],`Deneysel olasılık kutudaki top sayısına değil, deneyin sonucuna dayanır. Sarı: ${T} − ${fr_} − ${fb} = ${fy}. ${F(fy,T)}${fr(fy,T).d!==T?" = "+FH(fr(fy,T)):""}.`,()=>ff(fr(R(1,9),T)))};
G.equivMulti=()=>{let T,s;do{T=pick([20,25,40,50]);s=R(1,T-1)}while(fr(s,T).d===T);const v=s/T,p=v*100;
  const items=[{h:FH(fr(s,T)),ok:1},{h:pc(p),ok:1},{h:Dec(v),ok:1},{h:F(s,T),ok:1},{h:pc(s),ok:0},{h:F(T-s,T),ok:0},{h:"0,"+String(s).padStart(2,"0"),ok:0},{h:F(s,100),ok:0}].filter((x,i,a)=>a.findIndex(y=>y.h===x.h)===i);
  const bad=items.filter(x=>!x.ok&&((x.h===pc(s)&&s===p)||(x.h==="0,"+String(s).padStart(2,"0")&&s/100===v)||(x.h===F(s,100)&&s===p)));
  const it=shuffle(items.filter(x=>!bad.includes(x)));
  return{t:"multi",q:`Bir deneyde olay ${T} tekrarın ${s} tanesinde gerçekleşti. Bu olayın deneysel olasılığını gösteren değerlerin hepsini seç.`,k:"eq:"+it.map(x=>x.h).join("|"),items:it.map(x=>x.h),ans:it.map((x,i)=>x.ok?i:-1).filter(i=>i>=0),
    e:`${F(s,T)} = ${FH(fr(s,T))} = ${Number.isInteger(p)?F(p,100)+" = ":""}%${Dec(p)} = ${Dec(v)}`}};

G.students=()=>{const EY=["Mavi","Kahverengi","Ela","Yeşil"];const names=shuffle(["Ayşe","Mehmet","Zeynep","Ali","Fatma","Hasan","Elif","Mustafa","Aylin","Burak","Deniz","Kemal"]).slice(0,10);
  const eyes=names.map(()=>pick(EY));let tgt=pick(eyes),c=eyes.filter(x=>x===tgt).length;if(c===10||c===5){eyes[0]=EY.find(x=>x!==tgt);c=eyes.filter(x=>x===tgt).length;if(c===0){tgt=eyes[0];c=1}}
  return MC(`Bir sınıfa yeni kaydedilen öğrencilerin göz renkleri tabloda. Bu öğrencilerden birinin göz renginin ${tgt.toLowerCase()} olma olayının deneysel olasılığı kaçtır?${tbl(["Öğrenci","Göz rengi"],names.map((n,i)=>[n,eyes[i]]))}`,
  ff(fr(c,10)),[ff(fr(10-c,10)),ff(fr(1,4)),fv(c,10-c),ff(fr(c+1,10))],`${tgt} gözlü öğrenci: ${c}. ${F(c,10)}${fr(c,10).d!==10?" = "+FH(fr(c,10)):""}.`)};
G.barMissing=()=>{const T=pick([20,25,50]),cs=shuffle(COLORS).slice(0,4),mx=T===50?16:9;let v;do{v=[R(1,mx),R(1,mx),R(1,mx)];v.push(T-sum(v))}while(v[3]<1||v[3]>mx+4);
  const k=R(0,3),shown=v.map((x,i)=>i===k?null:x),p=v[k]*100/T;
  return MC(`Bir çark ${T} kez çevrildi. Grafikte ${cs[k].toLowerCase()} rengin sütunu silinmiş. Okun ${cs[k].toLowerCase()} rengi gösterme olayının deneysel olasılığı yüzde kaçtır?${bar(cs,shown,"Okun gösterdiği renklerin sıklığı")}`,
  pcv(p),[pcv(v[k]),pcv(100-p),pcv(25)],`${cs[k]}: ${T} − ${v.filter((_,i)=>i!==k).join(" − ")} = ${v[k]}. ${F(v[k],T)} = %${Dec(p)}.`,()=>pcv(p+5*R(1,3)))};
G.temps=()=>{const base=R(24,30),t=Array.from({length:20},()=>base+R(-3,5)),tgt=pick(t),c=t.filter(x=>x===tgt).length;
  return MC(`Bir ilçede 20 gün boyunca ölçülen ortalama sıcaklıklar tabloda. Herhangi bir günde sıcaklığın ${tgt} °C olma olayının deneysel olasılığı yüzde kaçtır?${tbl(["Gün",...Array.from({length:10},(_,i)=>String(i+1))],[["°C",...t.slice(0,10).map(String)]])}${tbl(["Gün",...Array.from({length:10},(_,i)=>String(i+11))],[["°C",...t.slice(10).map(String)]])}`,
  pcv(c*5),[pcv(c),pcv(c*10),pcv(100-c*5)],`${tgt} °C olan gün sayısı ${c}. ${F(c,20)} = %${c*5}.`,()=>pcv(5*R(1,8)))};
G.predict=()=>{const n=pick([10,20,25]),s=R(Math.ceil(n/3),n-2),k=R(2,5),N=n*k,a=s*k;const nm=pick(NAMES);
  return MC(`${nm} ${n} serbest atışın ${s} tanesinde isabet sağladı. Aynı başarı oranıyla ${N} atış yaparsa yaklaşık kaç isabet beklenir?`,iv(a),[iv(s+N-n),iv(N-a),iv(a+k)],`Deneysel olasılık ${F(s,n)}. ${N} · ${F(s,n)} = ${N} ÷ ${n} · ${s} = ${a}.`,()=>iv(a+R(2,5)))};
G.minTrials=()=>{let T0,v,fs,ans;do{T0=pick([12,20,24,30,40,60]);const cut=distinct(3,1,T0-1).sort((a,b)=>a-b);v=[cut[0],cut[1]-cut[0],cut[2]-cut[1],T0-cut[2]];fs=v.map(x=>fr(x,T0));ans=fs.map(f=>f.d).reduce(lcm)}while(ans===T0&&Math.random()<.6);
  const cs=shuffle(COLORS).slice(0,4),dens=fs.map(f=>f.d);
  return MC(`Torbadan top çekme deneyinde renklere göre deneysel olasılıklar tabloda. Bu deney en az kaç kez yapılmıştır?${tbl(["Renk",...cs],[["Deneysel olasılık",...fs.map(FH)]])}`,iv(ans),[iv(dens.reduce((a,b)=>a*b,1)>500?ans*2:dens.reduce((a,b)=>a*b,1)),iv(Math.max(...dens)===ans?ans+1:Math.max(...dens)),iv(sum(dens))],
  `Her rengin sıklığı doğal sayı olmalı. Bu yüzden deney sayısı ${new Set(dens).size>1?L([...new Set(dens)])+" paydalarının hepsinin ortak katı olmalı. Bunların en küçüğü "+ans:ans+" sayısının katı olmalı. En küçüğü "+ans}.`,()=>iv(ans+R(1,5)))};
G.defects=()=>{let qs;do{qs=[pick([2,4,8]),pick([2,3,4,6]),pick([4,5,8]),pick([3,6,8])]}while(new Set(qs).size<3);const n=qs.reduce(lcm),tot=sum(qs.map(q=>n/q));
  return MC(`Bir fabrikada A, B, C ve D ürünlerinden eşit sayıda test edildi. Ürünlerin hatalı olma olayının deneysel olasılıkları tabloda. Test edilen toplam hatalı ürün sayısı en az kaçtır?${tbl(["Ürün","A","B","C","D"],[["Hatalı olma",...qs.map(q=>F(1,q))]])}`,
  iv(tot),[iv(n),iv(sum(qs)),iv(tot*2)],`Her üründen test edilen sayı ${L([...new Set(qs)])} sayılarının ortak katı olmalı; en az ${n}. Hatalılar: ${qs.map(q=>`${n} ÷ ${q} = ${n/q}`).join(", ")}. Toplam ${tot}.`,()=>iv(tot+R(1,4)))};
G.players3=()=>{let rows;do{rows=shuffle(NAMES).slice(0,3).map(nm=>{const n=pick([20,25,40,50]);return{nm,n,s:R(Math.ceil(n*.45),n-2)}})}
  while(new Set(rows.map(r=>r.s/r.n)).size<3||rows.reduce((a,b)=>b.s>a.s?b:a)===rows.reduce((a,b)=>b.s/b.n>a.s/a.n?b:a));
  const best=rows.reduce((a,b)=>b.s/b.n>a.s/a.n?b:a);
  return MC(`Okul takımı için üç okçunun antrenman sonuçları tabloda. Deneysel olasılığa göre isabet ettirme olasılığı en yüksek okçu kimdir?${tbl(["Okçu","Atış","İsabet"],rows.map(r=>[r.nm,String(r.n),String(r.s)]))}`,best.nm,rows.filter(r=>r!==best).map(r=>r.nm),
  rows.map(r=>`${r.nm}: ${F(r.s,r.n)} = %${Dec(r.s*100/r.n)}`).join(" · ")+". En çok isabet sayısı değil, en yüksek oran önemlidir.")};
G.factory=()=>{const S=pick([50,100,200]),B=pick([1000,2000,5000]),k=R(2,12),a=k*B/S;
  return MC(`Bir fabrikada rastgele seçilen ${S} üründen ${k} tanesi hatalı çıktı. ${B} ürünlük bir partide yaklaşık kaç hatalı ürün beklenir?`,iv(a),[iv(k*B/100===a?a*2:k*B/100),iv(B-a),iv(k*10)],`Hatalı olma olasılığı ${F(k,S)}. ${B} · ${F(k,S)} = ${B} ÷ ${S} · ${k} = ${a}.`,()=>iv(a+R(1,5)*5))};

function build(st,seen){const out=[],used={};
  for(const lv of st.plan){const pool=st.pool[lv];let idx=pool.map((_,i)=>i).filter(i=>!used[lv+":"+i]);if(!idx.length)idx=pool.map((_,i)=>i);
    const i=pick(idx);used[lv+":"+i]=1;let q,tries=0;
    do{q=G[pool[i]]();tries++}while(tries<20&&(seen.has(key(q))||(tries<12&&RECENT.has(key(q)))));
    seen.add(key(q));q.lv=lv;q.st=st;out.push(q)}
  return out}

  <div class="stations">${STATIONS.map((s,i)=>{const lo=Math.min(...s.plan),hi=Math.max(...s.plan);return`
    <button class="st${s.skill?" skill":""}" data-i="${i}"><span class="code">${s.code}</span><span class="name">${s.name}</span><span class="sub">${s.sub}</span><span class="n">${s.plan.length} görev · Seviye ${lo} → ${hi}</span></button>`}).join("")}
  </div>

function start(idx){
  const seen=new Set();let list=[];idx.forEach(i=>{list=list.concat(build(STATIONS[i],seen))});
  if(idx.length>1)list=list.map((q,i)=>[q,i]).sort((a,b)=>a[0].lv-b[0].lv||a[1]-b[1]).map(x=>x[0]);
  saveRecent(list.map(key));
  S={idx,list,i:0,score:0,res:[],t0:Date.now(),qt:Date.now(),sec:0};
  hud(true);$("#score").textContent=0;$("#time").textContent="00:00";
  clearInterval(tick);tick=setInterval(()=>{S.sec=Math.floor((Date.now()-S.t0)/1000);$("#time").textContent=fmt(S.sec)},500);
  show();
}

function show(){
  const q=S.list[S.i];S.qt=Date.now();S.locked=false;
  const prog=S.list.map((_,k)=>`<i class="${k<S.i?(S.res[k]?"ok":"no"):k===S.i?"now":""}"></i>`).join("");
  let body="";
  if(q.t==="mc"){const ord=shuffle(q.o.map((o,k)=>k));body=`<div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join("")}</div>`}
  else if(q.t==="tf")body=`<div class="opts"><button class="opt" data-k="1">Doğru</button><button class="opt" data-k="0">Yanlış</button></div>`;
  else if(q.t==="cls")body=`<div class="opts"><button class="opt" data-k="0">${(q.lbl||["Sonlu ondalık","Devirli ondalık"])[0]}</button><button class="opt" data-k="1">${(q.lbl||["Sonlu ondalık","Devirli ondalık"])[1]}</button></div>`;
  else if(q.t==="nl")body=`<div class="hint">Doğru noktaya dokun.</div><div class="nl" id="nl"></div>`;
  else if(q.t==="order")body=`<div class="hint">Sayılara en küçükten başlayarak sırayla dokun.</div>
      <div class="slots" id="slots"><span class="ph">Seçtiklerin buraya dizilecek</span></div>
      <div class="chips" id="chips"></div>
      <div class="row"><button class="ghost" id="reset">Sıfırla</button><button class="go" id="check" disabled>Kontrol et</button></div>`;
  else if(q.t==="multi")body=`<div class="hint">Doğru olanların hepsine dokun, sonra kontrol et.</div>
      <div class="chips" id="chips">${q.items.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="false">${x}</button>`).join("")}</div>
      <div class="row"><button class="go" id="check" disabled>Kontrol et</button></div>`;
  app.innerHTML=`<section class="card pop${q.st.skill?" skillcard":""}">
    <div class="qhead"><div class="tags"><span class="tag">${q.st.code} · ${q.st.name}</span>${stars(q.lv)}</div><div class="prog">${prog}</div></div>
    <div class="q">${q.q}</div>${body}<div id="fb"></div></section>`;
  if(q.t==="mc"||q.t==="tf"||q.t==="cls"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(S.locked)return;const k=+b.dataset.k,corr=q.t==="tf"?(q.a?1:0):q.a,ok=k===corr;
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===corr)x.classList.add("ok")});
      if(!ok)b.classList.add("no");answer(ok)})}
  if(q.t==="nl")drawNL(q);
  if(q.t==="order")setupOrder(q);
  if(q.t==="multi")setupMulti(q);
  scrollTo(0,0);
}

function lbl(v,lab){const s=Math.round(v*1000)/1000;if(!Number.isInteger(s))return"";return lab&&s%lab!==0?"":I(s)}
function drawNL(q){
  const box=$("#nl");const n=Math.round((q.max-q.min)/q.step);const pad=6,W=100-2*pad;const x=k=>pad+W*k/n;
  let html=`<svg viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true">
    <line x1="1" y1="50" x2="99" y2="50" stroke="#2B17B0" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <polygon points="99.5,50 97,44 97,56" fill="#2B17B0"/><polygon points="0.5,50 3,44 3,56" fill="#2B17B0"/>`;
  for(let k=0;k<=n;k++){const big=lbl(q.min+k*q.step,q.lab)!=="";
    html+=`<line x1="${x(k)}" x2="${x(k)}" y1="${big?32:40}" y2="${big?68:60}" stroke="#2B17B0" stroke-width="${big?3:2}" vector-effect="non-scaling-stroke"/>`}
  html+=`</svg>`;
  for(let k=0;k<=n;k++){const t=lbl(q.min+k*q.step,q.lab);
    if(t)html+=`<div class="nlab" style="left:${x(k)}%">${t}</div>`;
    html+=`<button class="hit" data-k="${k}" aria-label="nokta ${k+1}" style="left:${x(k)}%;width:${Math.max(W/n,4)}%"></button>`}
  box.innerHTML=html;
  const ansK=Math.round((q.ans-q.min)/q.step);
  box.querySelectorAll(".hit").forEach(b=>b.onclick=()=>{
    if(S.locked)return;const k=+b.dataset.k,ok=k===ansK;
    const dot=(kk,c)=>{const d=document.createElement("div");d.className="dot pop";d.style.left=x(kk)+"%";d.style.background=c;box.appendChild(d)};
    if(!ok)dot(k,"#F47A5E");dot(ansK,"#1CC8D8");
    box.querySelectorAll(".hit").forEach(h=>h.disabled=true);answer(ok)});
}

function setupOrder(q){
  const chips=$("#chips"),slots=$("#slots");let picked=[];
  const items=q.items.map((it,k)=>({h:it[0],v:it[1],k}));
  const render=()=>{
    chips.innerHTML=items.filter(it=>!picked.includes(it)).map(it=>`<button class="chip" data-k="${it.k}">${it.h}</button>`).join("");
    slots.innerHTML=picked.length?picked.map(it=>`<span class="chip in">${it.h}</span>`).join(""):`<span class="ph">Seçtiklerin buraya dizilecek</span>`;
    chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(S.locked)return;picked.push(items.find(it=>it.k==b.dataset.k));render()});
    $("#check").disabled=picked.length!==items.length};
  render();
  $("#reset").onclick=()=>{if(S.locked)return;picked=[];render()};
  $("#check").onclick=()=>{if(S.locked)return;const sorted=items.slice().sort((a,b)=>a.v-b.v);let ok=true;
    slots.querySelectorAll(".chip").forEach((c,i)=>{const good=picked[i].v===sorted[i].v;if(!good)ok=false;c.classList.remove("in");c.classList.add(good?"ok":"no")});
    $("#reset").disabled=true;$("#check").disabled=true;answer(ok)};
}

function setupMulti(q){
  const sel=new Set(),chips=app.querySelectorAll("#chips .chip"),A=new Set(q.ans);
  chips.forEach(c=>c.onclick=()=>{if(S.locked)return;const i=+c.dataset.i;
    if(sel.has(i)){sel.delete(i);c.classList.remove("in");c.setAttribute("aria-pressed","false")}else{sel.add(i);c.classList.add("in");c.setAttribute("aria-pressed","true")}
    $("#check").disabled=sel.size===0});
  $("#check").onclick=()=>{if(S.locked)return;const ok=sel.size===A.size&&[...sel].every(i=>A.has(i));
    chips.forEach(c=>{const i=+c.dataset.i;c.disabled=true;c.classList.remove("in");
      if(A.has(i))c.classList.add(sel.has(i)?"ok":"miss");else if(sel.has(i))c.classList.add("no");else c.classList.add("off")});
    $("#check").disabled=true;answer(ok)};
}

function answer(ok){
  S.locked=true;const q=S.list[S.i];const fast=(Date.now()-S.qt)<BONUS[q.lv]*1000;let gain=0;
  if(ok){gain=10*q.lv+(fast?5:0);S.score+=gain;$("#score").textContent=S.score}
  S.res[S.i]=ok;const last=S.i===S.list.length-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"} pop"><div class="msg"><strong>${ok?(fast?`Harika! +${gain} puan (hız bonusu dahil)`:`Doğru! +${gain} puan`):"Bu sefer olmadı"}</strong>${q.e}</div>
