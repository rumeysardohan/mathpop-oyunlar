<title>Işın mı Doğru mu?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sabit marka şeridi (simge solda, puan/süre sağda) + ortada tek beyaz oyun kartı */
:root{
  --indigo:#2B17B0; --indigo-deep:#1E0F85; --lav:#EEE8FF; --white:#FFFFFF;
  --turq:#1CC8D8; --coral:#F47A5E; --ink:#1B1060; --muted:#6A5FA8;
  --f-head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --bar:88px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--indigo);color:var(--ink);font-family:var(--f-body);font-size:clamp(17px,1.1vw + 12px,24px);
  background-image:radial-gradient(circle at 12% 88%,rgba(28,200,216,.18) 0 18%,transparent 19%),radial-gradient(circle at 92% 20%,rgba(244,122,94,.16) 0 14%,transparent 15%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--indigo-deep)}

/* Marka şeridi */
.bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--indigo-deep);
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.brand img{width:64px;height:64px;border-radius:50%;flex:none;border:3px solid var(--white);background:var(--white);display:block}
.handle{color:var(--lav);font-weight:800;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.hud{margin-left:auto;display:flex;gap:8px;flex:none}
.chip{background:var(--white);color:var(--ink);border-radius:999px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:70px}
.chip small{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font-family:var(--f-head);font-size:24px;font-variant-numeric:tabular-nums}
.chip.warn b{color:var(--coral)}
@media (max-width:460px){.handle{display:none}.chip{min-width:62px;padding:5px 10px}.chip b{font-size:21px}}

main{min-height:100%;box-sizing:border-box;padding-top:calc(var(--bar) + env(safe-area-inset-top,0px) + 18px);padding-bottom:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center}
.card{background:var(--white);border-radius:28px;width:100%;max-width:880px;box-sizing:border-box;padding:clamp(20px,3vw,40px);box-shadow:0 10px 0 rgba(0,0,0,.18)}

h1,h2{font-family:var(--f-head);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,5vw + 16px,84px);color:var(--white);text-align:center;font-weight:800}
h1 .t{color:var(--turq)} h1 .c{color:var(--coral)}
.lead{color:var(--lav);text-align:center;max-width:36ch;margin:10px auto 22px;font-weight:700}

/* Başlangıç: 4 kavram kartı */
.concepts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:1000px}
@media (max-width:820px){.concepts{grid-template-columns:repeat(2,1fr)}}
.concept{background:var(--white);border-radius:22px;padding:14px 12px 16px;text-align:center;min-width:0}
.concept h3{font-family:var(--f-head);margin:0;font-size:1.15em;color:var(--indigo)}
.concept svg{width:100%;height:auto;display:block}
.concept .nt-wrap{font-size:1.25em;margin-top:2px}
.concept p{margin:4px 0 0;font-size:.78em;color:var(--muted);font-weight:700}

.btn{font-family:var(--f-head);font-weight:800;font-size:clamp(22px,1.2vw + 16px,32px);border:0;border-radius:999px;
  padding:14px 40px;min-height:64px;cursor:pointer;touch-action:manipulation;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--turq);outline-offset:3px}
.btn-go{background:var(--coral);color:var(--white);box-shadow:0 6px 0 #C4533A;margin-top:26px}
.btn-next{background:var(--indigo);color:var(--white);box-shadow:0 6px 0 var(--indigo-deep)}

/* Soru ekranı */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qno{font-family:var(--f-head);font-weight:800;color:var(--muted);font-size:.9em;white-space:nowrap}
.track{flex:1;height:12px;background:var(--lav);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--turq);border-radius:99px;transition:width .3s}
.tbar{height:8px;background:var(--lav);border-radius:99px;overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;background:var(--indigo);transition:width 1s linear}
.tbar.low i{background:var(--coral)}
.qtext{font-family:var(--f-head);font-weight:700;font-size:clamp(24px,1.6vw + 16px,40px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.fig{background:var(--lav);border-radius:20px;margin:6px 0 14px;padding:6px}
.fig svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font-family:var(--f-body);font-weight:800;font-size:clamp(20px,1.1vw + 15px,30px);color:var(--ink);background:var(--white);
  border:4px solid var(--lav);border-radius:20px;min-height:72px;padding:10px 16px;cursor:pointer;touch-action:manipulation;
  display:flex;align-items:center;gap:12px;text-align:left;transition:transform .1s,background .15s,border-color .15s}
.opt:hover{border-color:#CFC2FF}
.opt:active{transform:scale(.97)}
.opt .k{font-family:var(--f-head);width:40px;height:40px;flex:none;border-radius:50%;background:var(--lav);color:var(--indigo);display:grid;place-items:center;font-size:.8em}
.opt.ok{background:var(--turq);border-color:var(--turq);color:var(--white)}
.opt.ok .k{background:var(--white);color:#0E8F9B}
.opt.no{background:var(--coral);border-color:var(--coral);color:var(--white)}
.opt.no .k{background:var(--white);color:#C4533A}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.fb{margin-top:16px;border-radius:20px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb.good{background:#E3FAFC;border:3px solid var(--turq)}
.fb.bad{background:#FFEDE8;border:3px solid var(--coral)}
.fb .msg{flex:1;min-width:200px}
.fb .msg b{font-family:var(--f-head);font-size:1.15em;display:block}
.fb.good .msg b{color:#0E8F9B} .fb.bad .msg b{color:#C4533A}
.fb .msg span{font-weight:700}

/* Gösterim (notasyon) */
.nt{display:inline-block;position:relative;padding-top:.42em;font-family:var(--f-body);font-weight:800;white-space:nowrap;line-height:1}
.nt svg{position:absolute;top:0;left:0;width:100%;height:.36em;overflow:visible}
.nt.ray svg{left:.32em;width:calc(100% - .32em)}

/* Sonuç */
.result{text-align:center}
.result .big{width:150px;height:150px;border-radius:50%;border:6px solid var(--turq);display:block;margin:0 auto 10px;background:var(--white)}
.result h2{font-size:clamp(34px,3vw + 18px,60px);color:var(--indigo)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--lav);border-radius:18px;padding:12px 6px}
.stat b{font-family:var(--f-head);font-size:clamp(30px,2vw + 18px,48px);color:var(--indigo);display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-weight:800;color:var(--muted);font-size:.75em;text-transform:uppercase;letter-spacing:.06em}
.cheer{font-weight:800;font-size:1.1em;margin:14px auto 0;max-width:32ch}
.stars{font-family:var(--f-head);font-size:2em;color:var(--coral);letter-spacing:.1em;line-height:1}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.tbar i,.track i{transition:none}}
</style>

<main id="app"></main>

<script>
const ICON = document.querySelector('.brand img').src;
const PER_Q = 20, ROUND = 12;

/* ---------- Gösterimler ---------- */
const ARW = (both)=>`<svg viewBox="0 0 40 8" preserveAspectRatio="none" aria-hidden="true"><line x1="${both?3:0}" y1="4" x2="37" y2="4" stroke="currentColor" stroke-width="1.6"/><path d="M40 4 L35 1 L35 7 Z" fill="currentColor"/>${both?'<path d="M0 4 L5 1 L5 7 Z" fill="currentColor"/>':''}</svg>`;
const N = {
  dogru:(a,b)=>`<span class="nt">${ARW(true)}${a}${b}</span>`,
  isin:(a,b)=>`<span class="nt ray">${ARW(false)}[${a}${b}</span>`,
  dp:(a,b)=>`<span class="nt">[${a}${b}]</span>`,
  nokta:(a)=>`<span class="nt">${a}</span>`
};

/* ---------- Şekiller ---------- */
const C = {line:'#2B17B0', dot:'#1B1060', lab:'#1B1060'};
function head(x,y,dir){ // dir 1 sağ, -1 sol
  return `<path d="M${x} ${y} L${x-16*dir} ${y-10} L${x-16*dir} ${y+10} Z" fill="${C.line}"/>`;
}
function dot(x,y,l,up=true){
  return `<circle cx="${x}" cy="${y}" r="7" fill="${C.dot}"/><text x="${x}" y="${up?y-18:y+36}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="24" fill="${C.lab}">${l}</text>`;
}
function fig(f){
  const y=66; let s='';
  if(f.k==='nokta'){ s=dot(160,y+4,f.p[0]); }
  if(f.k==='dogru'){ s=`<line x1="22" y1="${y}" x2="298" y2="${y}" stroke="${C.line}" stroke-width="5" stroke-linecap="round"/>`+head(306,y,1)+head(14,y,-1)+dot(110,y,f.p[0])+dot(210,y,f.p[1]); }
  if(f.k==='dp'){ s=`<line x1="60" y1="${y}" x2="260" y2="${y}" stroke="${C.line}" stroke-width="5" stroke-linecap="round"/>`+dot(60,y,f.p[0])+dot(260,y,f.p[1]); }
  if(f.k==='isin'){
    if(f.dir===-1){ s=`<line x1="22" y1="${y}" x2="260" y2="${y}" stroke="${C.line}" stroke-width="5" stroke-linecap="round"/>`+head(14,y,-1)+dot(260,y,f.p[0])+dot(140,y,f.p[1]); }
    else { s=`<line x1="60" y1="${y}" x2="298" y2="${y}" stroke="${C.line}" stroke-width="5" stroke-linecap="round"/>`+head(306,y,1)+dot(60,y,f.p[0])+dot(180,y,f.p[1]); }
  }
  if(f.k==='multi'){ const n=f.p.length, x0=40, x1=280;
    s=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C.line}" stroke-width="5" stroke-linecap="round"/>`;
    f.p.forEach((l,i)=>{ s+=dot(x0+(x1-x0)*i/(n-1),y,l); }); }
  return `<svg viewBox="0 0 320 100" role="img" aria-label="geometrik şekil">${s}</svg>`;
}

/* ---------- Soru havuzu (a = doğru seçeneğin sırası) ---------- */
const K4 = ['Nokta','Doğru','Doğru parçası','Işın'];
const POOL = [
 {q:'Şekildeki geometrik kavram hangisidir?', f:{k:'dogru',p:['A','B']}, o:K4, a:1, e:'İki ucunda da ok var: iki yönde sınırsız uzar. Bu bir doğrudur.'},
 {q:'Şekildeki geometrik kavram hangisidir?', f:{k:'dp',p:['C','D']}, o:K4, a:2, e:'İki ucu da noktayla sınırlı. Bu bir doğru parçasıdır.'},
 {q:'Şekildeki geometrik kavram hangisidir?', f:{k:'isin',p:['E','F']}, o:K4, a:3, e:'Bir başlangıç noktası var, diğer yönde sınırsız uzar. Bu bir ışındır.'},
 {q:'Şekildeki geometrik kavram hangisidir?', f:{k:'nokta',p:['K']}, o:K4, a:0, e:'Tek bir konumu gösteriyor ve büyük harfle adlandırılıyor. Bu bir noktadır.'},
 {q:'Şekildeki ışının gösterimi hangisidir?', f:{k:'isin',p:['A','B']}, o:[N.isin('A','B'),N.isin('B','A'),N.dp('A','B'),N.dogru('A','B')], a:0, e:'Işın başlangıç noktası A ile başlar: [AB ışını.'},
 {q:'Şekildeki ışının gösterimi hangisidir?', f:{k:'isin',p:['B','A'],dir:-1}, o:[N.isin('A','B'),N.isin('B','A'),N.dp('A','B'),N.dogru('A','B')], a:1, e:'Başlangıç noktası B, ışın A yönünde uzuyor: [BA ışını.'},
 {q:'Şekildeki doğru parçasının gösterimi hangisidir?', f:{k:'dp',p:['K','L']}, o:[N.dp('K','L'),N.isin('K','L'),N.dogru('K','L'),N.nokta('K')], a:0, e:'Doğru parçası iki köşeli parantezle yazılır: [KL].'},
 {q:'Şekildeki doğrunun gösterimi hangisidir?', f:{k:'dogru',p:['M','N']}, o:[N.dp('M','N'),N.isin('M','N'),N.dogru('M','N'),N.isin('N','M')], a:2, e:'Doğrunun üzerine iki yönlü ok konur: MN doğrusu.'},
 {q:'Hangisinin uzunluğu cetvelle ölçülebilir?', o:['Doğru','Işın','Doğru parçası','Hiçbiri'], a:2, e:'Doğru parçasının iki ucu belli olduğu için uzunluğu ölçülebilir.'},
 {q:'Farklı iki noktadan kaç doğru geçer?', o:['Hiç geçmez','Yalnız bir','İki','Sonsuz sayıda'], a:1, e:'Farklı iki noktadan bir ve yalnız bir doğru geçer.'},
 {q:'Bir noktadan kaç doğru geçer?', o:['Yalnız bir','İki','Dört','Sonsuz sayıda'], a:3, e:'Bir noktadan her yöne doğru çizilebilir: sonsuz sayıda.'},
 {q:'Bir ışının kaç başlangıç noktası vardır?', o:['Hiç yoktur','Bir','İki','Sonsuz sayıda'], a:1, e:'Işının yalnızca bir başlangıç noktası vardır.'},
 {q:'Bir doğru parçasının kaç uç noktası vardır?', o:['Bir','İki','Üç','Hiç yoktur'], a:1, e:'Doğru parçası iki uç noktayla sınırlıdır.'},
 {q:'Hangisi yalnızca bir yönde sınırsız uzar?', o:K4, a:3, e:'Işın, başlangıç noktasından tek yönde sınırsız uzar.'},
 {q:'Hangisi iki yönde de sınırsız uzar?', o:K4, a:1, e:'Doğrunun başı ve sonu yoktur; iki yönde de sınırsız uzar.'},
 {q:'Eni, boyu ve kalınlığı olmayan, yalnızca konum belirten kavram hangisidir?', o:K4, a:0, e:'Nokta yalnızca bir konum belirtir; boyutu yoktur.'},
 {q:'Şekilde kaç doğru parçası vardır?', f:{k:'multi',p:['A','B','C']}, o:['2','3','4','6'], a:1, e:'[AB], [BC] ve [AC]: toplam 3 doğru parçası.'},
 {q:'Şekilde kaç doğru parçası vardır?', f:{k:'multi',p:['A','B','C','D']}, o:['3','4','6','8'], a:2, e:'[AB], [AC], [AD], [BC], [BD], [CD]: toplam 6 doğru parçası.'},
 {q:`${N.dp('A','B')} ile ${N.dp('B','A')} için hangisi doğrudur?`, o:['Aynı doğru parçasıdır','Farklı doğru parçalarıdır','İkisi de ışındır','Uzunlukları farklıdır'], a:0, e:'Uç noktaları aynı olduğu için [AB] ve [BA] aynı doğru parçasıdır.'},
 {q:`${N.isin('A','B')} ile ${N.isin('B','A')} için hangisi doğrudur?`, o:['Aynı ışındır','Farklı ışınlardır','Uzunlukları eşittir','İkisi de doğru parçasıdır'], a:1, e:'Başlangıç noktaları ve yönleri farklı olduğu için farklı ışınlardır.'},
 {q:'El fenerinden çıkan ışık hangi kavrama örnektir?', o:K4, a:3, e:'Işık fenerden başlar ve bir yönde ilerler: ışın modeli.'},
 {q:'Haritada bir şehrin yerini gösteren işaret hangi kavrama örnektir?', o:K4, a:0, e:'Yalnızca bir konum gösterdiği için noktaya örnektir.'},
 {q:'Bir cetvelin iki ucu arasındaki kenarı hangi kavrama örnektir?', o:K4, a:2, e:'Başı ve sonu belli olduğu için doğru parçasına örnektir.'}
];

/* ---------- Durum ---------- */
let S = {};
const $ = (s)=>document.querySelector(s);
const app = $('#app');
const shuffle = (a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let tick=null;

function startScreen(){
  $('#hud').hidden = true; clearInterval(tick);
  const ex = [
    {h:'Nokta', f:{k:'nokta',p:['A']}, n:N.nokta('A'), t:'Konum belirtir'},
    {h:'Doğru', f:{k:'dogru',p:['A','B']}, n:N.dogru('A','B'), t:'İki yönde sınırsız'},
    {h:'Doğru parçası', f:{k:'dp',p:['A','B']}, n:N.dp('A','B'), t:'İki ucu belli'},
    {h:'Işın', f:{k:'isin',p:['A','B']}, n:N.isin('A','B'), t:'Bir yönde sınırsız'}
  ];
  app.innerHTML = `
    <h1>Işın mı, <span class="t">Doğru</span> mu<span class="c">?</span></h1>
    <p class="lead">${ROUND} soru, her soruya ${PER_Q} saniye. Hızlı cevap ekstra puan kazandırır!</p>
    <div class="concepts">${ex.map(e=>`<div class="concept"><h3>${e.h}</h3>${fig(e.f)}<div class="nt-wrap">${e.n}</div><p>${e.t}</p></div>`).join('')}</div>
    <button class="btn btn-go" id="go">Oyuna başla</button>`;
  $('#go').onclick = newGame;
}

function newGame(){
  S = {qs: shuffle(POOL).slice(0,ROUND), i:0, score:0, right:0, streak:0, t0:Date.now()};
  $('#score').textContent = 0; $('#hud').hidden = false;
  showQ();
}

function showQ(){
  const raw = S.qs[S.i];
  const order = shuffle([0,1,2,3]);
  S.cur = {opts: order.map(k=>raw.o[k]), ans: order.indexOf(raw.a), e: raw.e};
  S.left = PER_Q; S.locked = false;
  app.innerHTML = `
    <div class="card pop">
      <div class="qtop"><span class="qno">Soru ${S.i+1} / ${S.qs.length}</span><div class="track"><i style="width:${S.i/S.qs.length*100}%"></i></div></div>
      <div class="tbar" id="tbar"><i style="width:100%"></i></div>
      <p class="qtext">${raw.q}</p>
      ${raw.f?`<div class="fig">${fig(raw.f)}</div>`:''}
      <div class="opts">${S.cur.opts.map((o,i)=>`<button class="opt" id="opt${i}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  setTime();
  clearInterval(tick);
  tick = setInterval(()=>{ S.left--; setTime(); if(S.left<=0){ answer(-1); } },1000);
}

function setTime(){
  $('#time').textContent = Math.max(0,S.left);
  $('#timeChip').classList.toggle('warn', S.left<=5);
  const tb=$('#tbar'); if(tb){ tb.querySelector('i').style.width = (S.left/PER_Q*100)+'%'; tb.classList.toggle('low',S.left<=5); }
}

function answer(i){
  if(S.locked) return; S.locked = true; clearInterval(tick);
  const ok = i===S.cur.ans;
  app.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true;
    if(k===S.cur.ans) b.classList.add('ok'); else if(k===i) b.classList.add('no'); else b.classList.add('dim'); });
  let gain = 0;
  if(ok){ S.right++; S.streak++; gain = 10 + Math.ceil(S.left/2); S.score += gain; } else S.streak = 0;
  $('#score').textContent = S.score;
  const head = ok ? (S.streak>=3?`Harika! ${S.streak} doğru üst üste (+${gain})`:`Doğru! +${gain} puan`) : (i<0?'Süre doldu!':'Bu sefer olmadı');
  const last = S.i===S.qs.length-1;
  $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'} pop"><div class="msg"><b>${head}</b><span>${S.cur.e}</span></div>
    <button class="btn btn-next" id="next">${last?'Sonucu gör':'Sonraki soru'}</button></div>`;
  $('#next').onclick = ()=>{ S.i++; if(S.i<S.qs.length) showQ(); else result(); };
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function result(){
  $('#hud').hidden = false;
  const secs = Math.round((Date.now()-S.t0)/1000);
  const mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,'0');
  const r = S.right/S.qs.length;
  const stars = r>=.9?3:r>=.6?2:r>=.3?1:0;
  const msg = r===1?'Mükemmel! Nokta, doğru, doğru parçası ve ışın artık senin için çocuk oyuncağı!'
    : r>=.75?'Çok iyisin! Birkaç kavramı tekrar edersen tam puan senin.'
    : r>=.5?'Güzel gidiyorsun! Okların ve uç noktaların yerine dikkat et, bir tur daha dene.'
    : 'Her deneme seni geliştirir. Başlangıç ekranındaki örneklere bak ve tekrar dene!';
  app.innerHTML = `
    <div class="card result pop">
      <img class="big" src="${ICON}" alt="MathPopWithRu simgesi">
      <div class="stars" aria-label="${stars} yıldız">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <h2>Oyun bitti!</h2>
      <div class="stats">
        <div class="stat"><b>${S.score}</b><small>Puan</small></div>
        <div class="stat"><b>${S.right}/${S.qs.length}</b><small>Doğru</small></div>
        <div class="stat"><b>${mm}:${ss}</b><small>Süre</small></div>
      </div>
      <p class="cheer">${msg}</p>
      <button class="btn btn-go" id="again">Tekrar oyna</button>
    </div>`;
  $('#time').textContent = `${mm}:${ss}`; $('#timeChip').classList.remove('warn');
  $('#again').onclick = newGame;
}

startScreen();
</script>
