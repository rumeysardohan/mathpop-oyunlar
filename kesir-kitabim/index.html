<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Kesir Kitabım</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Yumuşak palet, göz yormayan pastel tonlar. Düzen: lavanta masada ciltli bir kitap. Kapalı kapakla açılır, iki eşit kâğıt sayfa, ortada cilt. Telefonda tek sayfa. */
:root{
  --indigo:#6A5FC8; --lav:#F1EDFA; --white:#fff; --ok:#A8E4EA; --no:#F8C4B6;
  --ink:#3F3874; --mute:#6A6394; --line:#E6E0F5; --deep:#BDB3EA;
  --paper:#FFFDFA; --barbg:#E3DDF7; --chipbg:#F3F0FC; --soft:#E3DDF7;
  --board:#B5ABE8; --cover:#D3CCF4; --peri:#A79FE2; --stroke:#7D76AB;
  --head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --bar:84px; --foot:76px; --spine:10px;
}
html{font-size:clamp(16px,.45vw + 11px,25px)}
body{background:var(--lav);color:var(--ink);font-family:var(--body);font-size:1rem;font-weight:700;line-height:1.45;
  padding-top:var(--bar);padding-bottom:var(--foot);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--barbg)}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--ok);outline-offset:2px}

/* Üst şerit */
#simge{position:fixed;z-index:40;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:64px;height:64px;border-radius:50%;background:var(--paper);box-shadow:0 2px 10px rgba(90,80,170,.25)}
#bar{position:fixed;z-index:30;top:0;left:0;right:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 74px);padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--barbg);display:flex;align-items:center;gap:.6rem;color:var(--ink)}
#handle{font-size:.82rem;font-weight:800;color:var(--mute);margin-right:auto;white-space:nowrap}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chipbg);border-radius:12px;min-width:4.6rem;height:56px;padding:0 .6rem;line-height:1.05}
.chip small{font-size:.72rem;font-weight:800;color:var(--mute)}
.chip b{font-family:var(--head);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
#menuBtn{background:var(--paper);color:var(--indigo);border:0;border-radius:12px;height:56px;padding:0 .9rem;font-weight:800;display:flex;align-items:center;gap:.4rem}
#menuBtn svg{width:1.4rem;height:1.4rem}

/* Alt gezinme */
#foot{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(var(--foot) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--barbg);display:flex;align-items:center;justify-content:space-between;gap:.75rem;color:var(--ink)}
.navb{min-height:56px;min-width:7.2rem;padding:0 1.1rem;border-radius:14px;border:0;background:var(--paper);color:var(--indigo);font-family:var(--head);font-weight:800;font-size:1.15rem}
.navb[disabled]{opacity:.35;cursor:default}
#pageNo{font-family:var(--head);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}

/* Kitap */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#book{position:relative;max-width:92rem;margin:0 auto}
.spread{display:block;background:var(--paper);border-left:10px solid var(--board);border-radius:6px 12px 12px 6px;
  box-shadow:3px 4px 0 var(--line),6px 8px 0 var(--paper),9px 12px 0 var(--line),0 14px 28px rgba(43,23,176,0.16)}
.spread.cov{background:var(--cover)}
.leaf{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.leaf.left{display:flex}
.spread.cov .leaf.left{display:none}
.scroll{flex:1;min-height:0;padding:.9rem 1.1rem 1.1rem;min-width:0}
.rh{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 1.1rem 0;font-size:.82rem;font-weight:800;color:var(--mute)}
.folio{padding:0 1.1rem .7rem;font-family:var(--head);font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;font-size:1.05rem}
.folio{text-align:right}
.leaf.left .rh+.scroll{padding-bottom:.4rem}
.corner{display:none}
.spread.hide-left>.leaf.left,.spread.hide-right>.leaf.right{visibility:hidden}

@media (min-width:900px) and (min-height:560px){
  #book{transition:transform .85s cubic-bezier(.45,.05,.35,1)}
  #book.closed{transform:translateX(-25%)}
  #book.closed>.spread>.leaf.left{visibility:hidden}
  .spread,.spread.cov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100dvh - var(--bar) - var(--foot) - 48px);min-height:28rem;background:none;border:0;border-radius:0;box-shadow:none}
  .spread.cov .leaf.left{display:flex}
  .leaf.left .folio{display:block}
  .scroll{overflow-y:auto;padding:.9rem 2.2rem 1rem}
  .rh{padding:1rem 2.2rem 0}
  .folio{padding:0 2.2rem .75rem}
  .leaf.left{border-radius:7px 0 0 7px;background:linear-gradient(to left,rgba(43,23,176,0.12),rgba(43,23,176,0.04) 3%,transparent 9%),var(--paper);
    box-shadow:-2px 3px 0 var(--line),-4px 6px 0 var(--paper),-6px 9px 0 var(--line),-8px 12px 0 var(--paper),-4px 7px 0 11px var(--board),-8px 22px 36px rgba(43,23,176,0.16);
    clip-path:inset(-80px 0 -80px -80px)}
  .leaf.right{border-radius:0 7px 7px 0;background:linear-gradient(to right,rgba(43,23,176,0.12),rgba(43,23,176,0.04) 3%,transparent 9%),var(--paper);
    box-shadow:2px 3px 0 var(--line),4px 6px 0 var(--paper),6px 9px 0 var(--line),8px 12px 0 var(--paper),4px 7px 0 11px var(--board),8px 22px 36px rgba(43,23,176,0.16);
    clip-path:inset(-80px -80px -80px 0)}
  .wrow{height:2.2rem}
  .wread{min-height:2.8rem}
  .opt{min-height:68px}
  .corner{display:block;position:absolute;bottom:0;width:2.6rem;height:2.6rem;border:0;padding:0;transition:width .18s,height .18s}
  .corner.nx{right:0;background:linear-gradient(315deg,var(--board) 49%,var(--paper) 50%,var(--line) 62%,#CFC4FF 100%);border-radius:12px 0 0 0;z-index:2;box-shadow:-3px -3px 8px rgba(43,23,176,0.12)}
  .corner.pv{left:0;background:linear-gradient(45deg,var(--board) 49%,var(--paper) 50%,var(--line) 62%,#CFC4FF 100%);border-radius:0 12px 0 0;z-index:2;box-shadow:3px -3px 8px rgba(43,23,176,0.12)}
  .corner:hover,.corner:focus-visible{width:3.6rem;height:3.6rem}
  .leaf.right .folio{padding-right:3.4rem}
  .leaf.left .folio{padding-left:3.4rem}
  .folio{min-height:2.6rem;display:flex;align-items:center;padding-top:0;padding-bottom:0}
  .leaf.right .folio{justify-content:flex-end}

}
/* Sayfa çevirme */
.fx{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%;pointer-events:none;z-index:5}
.fxh{position:absolute;top:0;bottom:0;width:50%}
.fxh>.leaf{position:absolute;inset:0}
.turn{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.face>.leaf{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:#4A4380;opacity:0}
.cast{position:absolute;top:0;bottom:0;width:50%;opacity:0}
.fxp{position:absolute;inset:0 0 0 var(--spine);perspective:1300px;perspective-origin:0 50%;pointer-events:none;z-index:5}
.fxp .turn{left:0;right:0;width:auto;transform-origin:0 50%}
.fxp .leaf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fx *,.fxp *{animation:none!important;transition:none!important}
.fx .scroll,.fxp .scroll{overflow:hidden}
.eyebrow{font-size:.85rem;font-weight:800;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.lesson h1,.ph1{font-size:2.3rem;font-weight:800;color:var(--indigo);margin:0 0 .5rem}
.lessonBody{display:grid;gap:.9rem;font-size:1.12rem;max-width:62ch}
.tip{background:var(--lav);border-radius:12px;padding:.7rem .85rem}
.tip b{font-family:var(--head);color:var(--indigo)}
.lessonFig{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.85rem;display:grid;gap:.5rem;justify-items:center}
.lessonFig svg{max-width:100%}
.lessonFig .m-grid{width:min(100%,11rem)}
.lessonFig .m-pie{width:min(100%,9rem)}

/* Kesir yazımı */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:var(--head);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin:0 .12em}
.fr>span{padding:.03em .22em}
.fr>span+span{border-top:.1em solid currentColor}
.big{font-size:2.5rem}.huge{font-size:3.4rem}

/* Etkinlik kabuğu */
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.pips{display:flex;gap:4px;flex:1;min-width:0}
.pip{flex:1;height:12px;border-radius:6px;background:var(--line)}
.pip.now{background:var(--peri)}
.pip.good{background:var(--ok)}
.pip.late{background:var(--no)}
.again{border:2px solid var(--indigo);background:var(--paper);color:var(--indigo);border-radius:12px;min-height:44px;padding:0 .75rem;font-weight:800;font-size:.92rem;white-space:nowrap}
.q{font-size:1.45rem;font-weight:800;line-height:1.3;margin-bottom:.8rem;font-family:var(--body)}
.q .fr{font-size:1.5em}
.body{display:grid;gap:1rem;justify-items:center}
.body>*{max-width:100%}
.fb{min-height:2.6rem;margin-top:.7rem;font-size:1.2rem;font-weight:800;border-radius:12px;padding:.35rem .8rem;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:.2rem}
.fb:empty{background:transparent}
.fb.ok{background:var(--ok);color:var(--ink)}
.fb.no{background:var(--no);color:var(--ink)}
.fb.info{background:var(--lav)}
.acts{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.7rem}
.btn{min-height:60px;min-width:9rem;padding:0 1.5rem;border:0;border-radius:16px;font-family:var(--head);font-size:1.3rem;font-weight:800;background:var(--indigo);color:#fff}
.btn.next{background:var(--ok);color:var(--ink)}
.btn.soft{background:var(--lav);color:var(--indigo)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

/* Modeller */
.m{display:block}
.m .part{stroke:var(--stroke);stroke-width:2;stroke-linejoin:round}
.m .part[tabindex]{cursor:pointer}
.m-strip{width:min(100%,30rem)}
.m-pie,.m-flower{width:min(100%,14rem)}
.m-grid{width:min(100%,19rem)}
.rowfit{display:flex;flex-wrap:wrap;gap:1.25rem;justify-content:center;align-items:center;width:100%}
.rowfit>*{min-width:0}

/* Seçenekler */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;width:min(100%,36rem)}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,26rem)}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{min-height:76px;border:3px solid var(--line);border-radius:16px;background:var(--paper);font-family:var(--head);font-size:1.9rem;font-weight:800;padding:.3rem}
.opt .fr{font-size:1.05em}
.opt.good{background:var(--ok);border-color:var(--ok)}
.opt.bad{background:var(--no);border-color:var(--no)}
.sym{font-size:2.6rem;line-height:1}

/* Tuş takımı */
.pad{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.fbox{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.fbox .bar2{width:5.2rem;height:6px;border-radius:3px;background:var(--ink)}
.slot{width:5.2rem;height:4.3rem;border:3px solid var(--line);border-radius:14px;background:var(--paper);font-family:var(--head);font-size:2.4rem;font-weight:800;line-height:1}
.slot.act{border-color:var(--indigo);background:var(--lav)}
.nbox .slot{width:8rem;height:5rem;font-size:3rem}
.lockd .slot{background:var(--ok);border-color:var(--ok)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;width:min(100%,19rem)}
.keys button{height:3.5rem;border:0;border-radius:12px;background:var(--lav);color:var(--indigo);font-family:var(--head);font-size:1.7rem;font-weight:800}
.keys .del{grid-column:span 2;font-size:1.2rem}

/* Stepper */
.steps{display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center}
.step{display:flex;align-items:center;gap:.4rem;background:var(--lav);border-radius:16px;padding:.4rem .5rem}
.step label{font-weight:800;color:var(--indigo);padding:0 .4rem}
.step button{width:3.6rem;height:3.6rem;border:0;border-radius:12px;background:var(--soft);color:var(--indigo);font-family:var(--head);font-size:2.2rem;font-weight:800;line-height:1}
.step output{font-family:var(--head);font-size:2.3rem;font-weight:800;min-width:2.8rem;text-align:center;font-variant-numeric:tabular-nums}
.liveTxt{font-size:1.1rem;text-align:center;color:var(--mute)}

/* Boyama */
.crayons{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.cray{width:3.2rem;height:3.2rem;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.cray.sel{box-shadow:0 0 0 4px var(--indigo)}
.counter{font-size:1.1rem;color:var(--mute)}

/* Eşleştirme */
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(3rem,16%,9rem);width:min(100%,46rem);touch-action:pan-y}
.mcol{display:grid;gap:.6rem;align-content:start}
.mi{position:relative;display:flex;align-items:center;justify-content:center;min-height:5.4rem;border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:.35rem .55rem;touch-action:none;user-select:none;-webkit-user-select:none}
.mi>*{pointer-events:none}
.mi .fr{font-size:2.1rem}
.mi .m-pie{width:4.5rem}.mi .m-strip{width:100%}
.mi.sel{border-color:var(--indigo);background:var(--lav)}
.mi.done{border-color:var(--ok);cursor:default}
.dot{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--stroke)}
.mcol.l .dot{right:-11px}.mcol.r .dot{left:-11px}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mlines line{stroke-width:6;stroke-linecap:round}

/* Şerit duvarı */
.wall{position:relative;display:grid;gap:5px;width:min(100%,50rem)}
.wrow{display:flex;height:2.65rem}
.wp{flex:1;min-width:0;border:0;padding:0;color:var(--ink);box-shadow:inset -1.5px 0 0 var(--paper),inset 1.5px 0 0 var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.wp .fr{font-size:.92rem}
.wp.yel{color:var(--ink)}
.wp.dim{opacity:.32}
.wp b{font-family:var(--head);font-size:1.5rem}
.wline{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);pointer-events:none}
.wread{min-height:3.4rem;font-size:1.5rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.1rem .3rem;text-align:center}
.wread small{font-family:var(--body);font-size:1.05rem;color:var(--mute)}

/* Hafıza */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55rem;width:min(100%,38rem)}
.mc{border:0;padding:0;background:none;aspect-ratio:1/.92;perspective:800px}
.mc-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.mc.open .mc-in{transform:rotateY(180deg)}
.mc-f,.mc-b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:.3rem}
.mc-b{background:var(--soft);color:var(--indigo);font-family:var(--head);font-size:2.2rem;font-weight:800}
.mc-f{background:var(--paper);border:3px solid var(--line);transform:rotateY(180deg)}
.mc-f .fr{font-size:1.9rem}
.mc-f .m-strip{width:92%}
.mc.found .mc-f{background:var(--ok);border-color:var(--ok)}

/* Sıralama */
.slots{display:flex;align-items:center;justify-content:center;gap:.25rem;width:100%}
.ss{flex:1 1 0;min-width:0;max-width:8rem;min-height:6.4rem;border:3px dashed var(--line);border-radius:14px;background:var(--lav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.25rem}
.ss.full{border-style:solid;background:var(--paper);border-color:var(--indigo)}
.ss .fr,.sc .fr{font-size:2.1rem}
.ss .m-strip,.sc .m-strip{width:100%}
.sign{font-family:var(--head);font-size:1.7rem;font-weight:800;color:var(--indigo)}
.pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;width:min(100%,36rem)}
.sc{min-height:6.4rem;border:3px solid var(--line);border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;padding:.25rem}
.sc[disabled]{visibility:hidden}

/* Sayı doğrusu */
.nl{width:min(100%,46rem)}
.nl .hit{fill:transparent;cursor:pointer}
.nl text{font-family:var(--head);font-weight:800;fill:var(--ink)}

/* Değer bulma */
.groups{display:grid;gap:.5rem;width:min(100%,44rem)}
.grp{border:3px solid var(--line);border-radius:12px;background:var(--paper);padding:.3rem;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;align-content:center;min-height:3.2rem}
.grp.on{background:var(--lav);border-color:var(--indigo)}
.grp svg{width:1.55rem;height:1.55rem}

/* Yarışma */
.clock{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:.5rem}
.clock i{display:block;height:100%;background:var(--peri);transition:width .25s linear}
.cdtxt{font-family:var(--head);font-weight:800;font-size:1.1rem;color:var(--indigo);text-align:right;margin-bottom:.2rem;font-variant-numeric:tabular-nums}

/* Karşılaştırma */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem minmax(0,1fr);gap:.6rem;align-items:center;width:min(100%,46rem)}
.cside{display:grid;gap:.4rem;justify-items:center}
.cside .m-pie{width:min(100%,9rem)}
.cside .fr{font-size:2.5rem}
.cbox{width:4.6rem;height:4.6rem;border:3px solid var(--stroke);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:2.8rem;font-weight:800}
.cbox.good{background:var(--ok);border-color:var(--ok)}

/* Sonuç */
.res{display:grid;gap:.8rem;justify-items:center;text-align:center;padding-block:.75rem}
.res img{width:112px;height:112px;border-radius:50%}

const DEN_W={2:'ikide',3:'üçte',4:'dörtte',5:'beşte',6:'altıda',7:'yedide',8:'sekizde',9:'dokuzda',10:'onda'};
const NUM_W=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz','on'];
const G={side:'L',started:false,page:0,level:2,res:{},live:0,playing:false,t0:0,acc:0,running:false,timers:[]};
let keyTarget=null;

/* ---------- Sayı yardımcıları ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,k){let o=[];while(o.length<k)o=o.concat(shuffle(a));return o.slice(0,k)}
const gcd=(a,b)=>b?gcd(b,a%b):a;
const F=(n,d)=>({n,d});
const cmp=(a,b)=>Math.sign(a.n*b.d-b.n*a.d);
const same=(a,b)=>cmp(a,b)===0;
const vkey=f=>{const g=gcd(f.n,f.d);return f.n/g+'/'+f.d/g};
const dens=L=>LEVELS[L-1].dens;
function fracPool(L){const o=[];dens(L).forEach(d=>{for(let n=1;n<d;n++)o.push(F(n,d))});return o}
function simplePool(L){return fracPool(L).filter(f=>gcd(f.n,f.d)===1)}
function uniqueByValue(a){const s=new Set();return a.filter(f=>{const k=vkey(f);if(s.has(k))return false;s.add(k);return true})}
const EQ=(()=>{const o=[];[2,3,4,5].forEach(d=>{for(let n=1;n<d;n++){if(gcd(n,d)!==1)continue;const a=F(n,d);
  WALL.forEach(D=>{if(D>d&&D%d===0)o.push({a,b:F(n*D/d,D)})})}});return o})();
const eqPool=L=>L===1?EQ.filter(e=>e.a.d<=4&&e.b.d<=8):EQ;
function eqByValue(L){const m={};shuffle(eqPool(L)).forEach(e=>{m[vkey(e.a)]=m[vkey(e.a)]||e});return Object.values(m)}
function distract(f,k){
  const all=fracPool(3);
  const near=shuffle(all.filter(x=>x.d===f.d)), far=shuffle(all.filter(x=>x.d!==f.d));
  const c=uniqueByValue(near.slice(0,Math.ceil(k/2)+1).concat(far)).filter(x=>!same(x,f));
  return c.slice(0,k);
}
function read(f){return (DEN_W[f.d]||'')+' '+NUM_W[f.n]}
function cap(s){return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1)}
function fr(f){return `<span class="fr" role="img" aria-label="${read(f)}"><span>${f.n}</span><span>${f.d}</span></span>`}

/* ---------- Soru üreticileri (her cevap burada hesaplanır) ---------- */
function genBuild(L){return sample(fracPool(L),6)}
function genRead(L){const s=['strip','pie','grid'];return sample(fracPool(L),6).map((f,i)=>({...f,shape:s[i%3]}))}
function genPaint(L){
  const s=['strip','pie','flower','grid'];
  const out=sample(fracPool(L),6).map((f,i)=>{let shape=s[i%4];if(shape==='flower'&&f.d<3)shape='pie';return {n:f.n,d:f.d,shape,pd:f.d,need:f.n}});
  if(L>=2){sample(eqPool(L),2).forEach((e,i)=>{out[4+i]={n:e.a.n,d:e.a.d,shape:i?'strip':'pie',pd:e.b.d,need:e.b.n,eq:true}})}
  return out;
}
function genMatch(L){
  const set=(k)=>{
    const vals=sample(uniqueByValue(L===1?simplePool(1):simplePool(L)),4);
    const pairs=vals.map(f=>{
      if(k===0)return {a:{t:'strip',f},b:{t:'pie',f}};
      if(k===1)return {a:{t:'num',f},b:{t:i2(L,f),f}};
      const e=EQ.filter(x=>same(x.a,f)&&(L>1||x.b.d<=8));
      const g=(L>=2&&e.length)?pick(e).b:f;
      return L>=2?{a:{t:'strip',f},b:{t:'pie',f:g}}:{a:{t:'pie',f},b:{t:'num',f}};
    });
    return {pairs,max:20};
  };
  return [set(0),set(1),set(2)];
}
function i2(L,f){return pick(['pie','strip'])}
const NOUNS=[{k:'apple',gen:'elmanın',nom:'elma',pred:'elmadır'},{k:'star',gen:'yıldızın',nom:'yıldız',pred:'yıldızdır'},{k:'cookie',gen:'kurabiyenin',nom:'kurabiye',pred:'kurabiyedir'},{k:'balloon',gen:'balonun',nom:'balon',pred:'balondur'}];
function genValue(L){
  const ds=L===1?[2,3,4]:L===2?[2,3,4,5,6]:[3,4,5,6,8,10], maxU=L===1?5:L===2?6:5;
  const seen=new Set(), out=[];
  while(out.length<6){
    const d=pick(ds), n=(L===1&&out.length<3)?1:ri(1,d-1), u=ri(2,maxU), N=d*u;
    if(N>40||seen.has(d+'-'+n+'-'+u))continue;
    seen.add(d+'-'+n+'-'+u);
    out.push({n,d,u,N,ans:n*u,noun:NOUNS[out.length%4],inv:false});
  }
  if(L===3){[4,5].forEach((ix,j)=>{const it=out[ix];it.inv=true;if(j===0){it.n=1}it.ans=it.N;it.part=it.n*it.u})}
  return out;
}
function genCompare(L){
  const pool=fracPool(L), seen=new Set(), out=[];
  const eq=pick(eqPool(L));
  let guard=0;
  while(out.length<7&&guard++<2000){
    let a=pick(pool),b=pick(pool);
    if(a.n===b.n&&a.d===b.d)continue;
    if(L===1&&a.d!==b.d&&a.n!==b.n&&!(a.d===2||b.d===2))continue;
    const k=[a.n,a.d,b.n,b.d].join();if(seen.has(k))continue;seen.add(k);out.push({a,b});
  }
  out.splice(ri(1,6),0,Math.random()<.5?{a:eq.a,b:eq.b}:{a:eq.b,b:eq.a});
  return out.map((p,i)=>({...p,shape:i%2?'pie':'strip',ans:cmp(p.a,p.b)}));
}
function genSort(L){
  return Array.from({length:5},(_,i)=>{
    const base=L===1?simplePool(1):L===2?uniqueByValue(shuffle(fracPool(2))):uniqueByValue(shuffle(fracPool(3)));
    const cards=sample(base,4), dir=i%2?'desc':'asc';
    return {cards,dir,order:cards.slice().sort((a,b)=>dir==='asc'?cmp(a,b):cmp(b,a))};
  });
}
function genLine(L){
  return sample(fracPool(L),6).map((f,i)=>{
    if(i%2===0)return {...f,kind:'place'};
    const opts=shuffle([F(f.n,f.d),...distract(f,2)]);
    return {...f,kind:'read',opts,ans:opts.findIndex(o=>o.n===f.n&&o.d===f.d)};
  });
}
function genOps(L){
  const ds=L===1?[3,4,5]:L===2?[4,5,6,8]:[6,8,10];
  const seen=new Set(), out=[]; let i=0;
  while(out.length<6){
    const d=pick(ds), op=out.length%2?'-':'+';
    let a,b,r;
    if(op==='+'){a=ri(1,d-2);b=ri(1,d-1-a);r=a+b}else{a=ri(2,d-1);b=ri(1,a-1);r=a-b}
    const k=[op,a,b,d].join();if(seen.has(k)&&i++<300)continue;seen.add(k);
    out.push({a,b,d,op,r,word:out.length>=2&&out.length!==4});
  }
  return out;
}
function genQuiz(L){
  const pool=fracPool(L), types=shuffle(['model','model','pay','word','denk','big','small','value','sum','diff']);
  return types.map(tp=>{
    const f=pick(pool);
    if(tp==='model'){const o=shuffle([f,...distract(f,3)]);return {tp,f,shape:pick(['strip','pie']),q:'Boyalı kısmı gösteren kesir hangisi?',opts:o,ans:o.indexOf(f)}}
    if(tp==='pay'){const wantD=Math.random()<.5,c=wantD?f.d:f.n;const nums=[...new Set([c,wantD?f.n:f.d,f.n+f.d,f.d+1,f.n+2,f.d+3])].slice(0,4);const o=shuffle(nums);
      return {tp,f,q:`${fr(f)} kesrinin ${wantD?'paydası':'payı'} kaçtır?`,opts:o,ans:o.indexOf(c)}}
    if(tp==='word'){const o=shuffle([f,...distract(f,3)]);return {tp,f,q:`“${cap(read(f))}” kesri hangisidir?`,opts:o,ans:o.indexOf(f)}}
    if(tp==='denk'){const e=pick(eqPool(L));const o=shuffle([e.b,...distract(e.a,3)]);return {tp,q:`${fr(e.a)} kesrine denk olan hangisidir?`,opts:o,ans:o.indexOf(e.b)}}
    if(tp==='big'||tp==='small'){const o=sample(uniqueByValue(shuffle(fracPool(Math.max(L,2)))),4);const s=o.slice().sort(cmp);const t=tp==='big'?s[3]:s[0];return {tp,q:`En ${tp==='big'?'büyük':'küçük'} kesir hangisidir?`,opts:o,ans:o.indexOf(t)}}
    if(tp==='value'){const d=pick(dens(L).filter(x=>x<=8)),n=ri(1,d-1),u=ri(2,6),N=d*u,a=n*u;
      const nums=[...new Set([a,u,N-a,a+u,a+d,N,a+1,a+2,a+3])].filter(x=>x>0).slice(0,4);const o=shuffle(nums);
      return {tp,q:`${N} sayısının ${fr(F(n,d))} kadarı kaçtır?`,opts:o,ans:o.indexOf(a)}}
    /* sum & diff */
    const d=pick((L===1?[3,4,5]:[4,5,6,8,10]));
    let a,b,r,sign;
    if(tp==='sum'){a=ri(1,d-2);b=ri(1,d-1-a);r=a+b;sign='+'}else{a=ri(2,d-1);b=ri(1,a-1);r=a-b;sign='−'}
    const t=F(r,d), o=shuffle([t,...distract(t,3)]);
    return {tp,q:`${fr(F(a,d))} ${sign} ${fr(F(b,d))} işleminin sonucu kaçtır?`,opts:o,ans:o.indexOf(t)};
  });
}

/* ---------- Modeller ---------- */
const GRID={2:[2,1],3:[3,1],4:[2,2],5:[5,1],6:[3,2],7:[7,1],8:[4,2],9:[3,3],10:[5,2]};
function fillOf(i,filled,color){
  if(typeof filled==='number')return i<filled?color:PAPER;
  return filled[i]||PAPER;
}
function partAttrs(i,interactive){return `class="part" data-i="${i}"`+(interactive?` tabindex="0" role="button" aria-label="Parça ${i+1}"`:'')}
function model(type,d,filled,opt={}){
  const c=opt.color||COLOR[d]||'#8A80D8', I=!!opt.interactive; let s='';
  const label=typeof filled==='number'?`${d} eşit parçanın ${filled} tanesi boyalı model`:'Boyanacak model';
  const head=(vb,cl)=>`<svg class="m m-${cl}" viewBox="${vb}" role="img" aria-label="${label}">`;
  if(type==='strip'){
    const W=360,H=66,w=(W-6)/d;
    s=head(`0 0 ${W} ${H}`,'strip');
    for(let i=0;i<d;i++)s+=`<rect ${partAttrs(i,I)} x="${3+i*w}" y="3" width="${w}" height="${H-6}" fill="${fillOf(i,filled,c)}"/>`;
    (opt.cross||[]).forEach(i=>{const x=3+i*w;s+=`<path d="M${x+5} 9L${x+w-5} ${H-9}M${x+w-5} 9L${x+5} ${H-9}" stroke="#5A5390" stroke-width="4" stroke-linecap="round"/>`});
    (opt.labels||[]).forEach((t,i)=>{s+=`<text x="${3+i*w+w/2}" y="${H/2+9}" text-anchor="middle" font-size="26" font-weight="800" font-family="Baloo 2,sans-serif" fill="#5A5390">${t}</text>`});
    return s+'</svg>';
  }
  if(type==='grid'){
    const [cols,rows]=GRID[d],u=Math.min(66,300/cols),W=cols*u+6,H=rows*u+6;
    s=head(`0 0 ${W} ${H}`,'grid');
    for(let i=0;i<d;i++){const x=3+(i%cols)*u,y=3+Math.floor(i/cols)*u;s+=`<rect ${partAttrs(i,I)} x="${x}" y="${y}" width="${u}" height="${u}" fill="${fillOf(i,filled,c)}"/>`}
    return s+'</svg>';
  }
  if(type==='flower'){
    s=head('0 0 200 200','flower');
    const rx=Math.min(31,56*Math.tan(Math.PI/d)*.86);
    for(let i=0;i<d;i++)s+=`<ellipse ${partAttrs(i,I)} cx="100" cy="46" rx="${rx}" ry="42" transform="rotate(${i*360/d} 100 100)" fill="${fillOf(i,filled,c)}"/>`;
    return s+`<circle cx="100" cy="100" r="17" fill="#F8E096" stroke="#7D76AB" stroke-width="2"/></svg>`;
  }
  s=head('0 0 200 200','pie');
  const R=95,C=100;
  if(d===1)return s+`<circle ${partAttrs(0,I)} cx="100" cy="100" r="${R}" fill="${fillOf(0,filled,c)}"/></svg>`;
  for(let i=0;i<d;i++){
    const a0=(i/d)*2*Math.PI-Math.PI/2,a1=((i+1)/d)*2*Math.PI-Math.PI/2;
    const p=(a)=>`${(C+R*Math.cos(a)).toFixed(2)} ${(C+R*Math.sin(a)).toFixed(2)}`;
    s+=`<path ${partAttrs(i,I)} d="M100 100L${p(a0)}A${R} ${R} 0 ${1/d>.5?1:0} 1 ${p(a1)}Z" fill="${fillOf(i,filled,c)}"/>`;
  }
  return s+'</svg>';
}
function rep(x,f){return x.t==='num'?fr(x.f):model(x.t,x.f.d,x.f.n)}
const ICON={
  apple:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-2-8-1.500-8 6 0 5 3.500 9 5.500 9 1 0 1.500-.6 2.500-.6s1.500.6 2.500.6c2 0 5.500-4 5.500-9 0-7.500-6-8-8-6z" fill="#F0A5A5"/><path d="M12 7c0-2 1.500-4 4-5 0 2.500-1.500 4.500-4 5z" fill="#AEDCA9"/></svg>`,
  star:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.600 7 .8-5.200 4.800 1.400 7.100L12 17.700l-6.200 3.600 1.400-7.100L2 9.400l7-.8z" fill="#F8DC8C" stroke="#E5BE6A" stroke-width="1"/></svg>`,
  cookie:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#E0BC94"/><circle cx="8" cy="9" r="1.700" fill="#9A7A5E"/><circle cx="15" cy="8" r="1.500" fill="#9A7A5E"/><circle cx="16" cy="15" r="1.800" fill="#9A7A5E"/><circle cx="9.500" cy="16" r="1.500" fill="#9A7A5E"/></svg>`,
  balloon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.500v7" stroke="#7D76AB" stroke-width="1.500"/><ellipse cx="12" cy="9" rx="7" ry="8" fill="#F3AECB"/></svg>`
};
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.600 7 .8-5.200 4.800 1.400 7.100L12 17.700l-6.200 3.600 1.400-7.100L2 9.400l7-.8z" fill="${on?'#F6D077':'#E6E0F5'}"/></svg>`;
const stars=n=>[1,2,3].map(i=>star(i<=n)).join('');
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* ---------- Puan ve süre ---------- */
const $=s=>document.querySelector(s);
const later=(fn,ms)=>{const id=setTimeout(fn,ms);G.timers.push(id);return id};
function clearManaged(){G.timers.forEach(id=>{clearTimeout(id);clearInterval(id)});G.timers=[]}
const elapsed=()=>G.acc+(G.running?Math.floor((Date.now()-G.t0)/1000):0);
function timerStart(){G.acc=0;G.t0=Date.now();G.running=true;drawBar()}
function timerStop(){G.acc=elapsed();G.running=false;drawBar()}
function totalScore(){const cur=PAGES[G.page].id;let t=0;for(const k in G.res){if(!(G.playing&&k===cur))t+=G.res[k].score}return t+(G.playing?G.live:0)}
function drawBar(){$('#score').textContent=totalScore();$('#time').textContent=fmtT(elapsed())}
setInterval(()=>{if(G.running)$('#time').textContent=fmtT(elapsed())},400);

/* ---------- Ortak soru kabuğu ---------- */
const RIGHT=['Doğru!','Aferin!','Harika!','Tam isabet!','Çok güzel!'];
function runner(host,ch,items,render,opt={}){
  const max=items.reduce((s,x)=>s+(x.max||10),0), marks=[];
  let i=0,done=false;
  G.live=0;G.playing=true;timerStart();
  function finish(){if(done)return;done=true;clearManaged();endChapter(ch,host,G.live,max)}
  function show(){
    keyTarget=null;
    const it=items[i];let tries=0,resolved=false,checkFn=null,revealFn=null;
    host.innerHTML=`${opt.head?opt.head():''}<div class="top"><div class="pips">${items.map((_,k)=>`<span class="pip ${k<i?marks[k]:k===i?'now':''}"></span>`).join('')}</div><button class="again">Tekrar oyna</button></div>
      <div class="q"></div><div class="body"></div><div class="fb" role="status" aria-live="polite"></div>
      <div class="acts"><button class="btn soft" id="btnReveal" hidden>Cevabı göster</button><button class="btn" id="btnCheck">Kontrol et</button><button class="btn next" id="btnNext" hidden>${i===items.length-1?'Sonucu gör':'Sonraki soru'}</button></div>`;
    const q=host.querySelector('.q'),body=host.querySelector('.body'),fb=host.querySelector('.fb'),bC=host.querySelector('#btnCheck'),bR=host.querySelector('#btnReveal'),bN=host.querySelector('#btnNext');
    host.querySelector('.again').onclick=()=>startChapter();
    const say=(cls,html)=>{fb.className='fb '+cls;fb.innerHTML=html};
    function settle(mark){resolved=true;marks[i]=mark;keyTarget=null;bC.hidden=true;bR.hidden=true;ctx.after&&ctx.after();
      if(opt.oneShot){later(advance,1250)}else{bN.hidden=false}}
    function advance(){i++;if(i>=items.length)finish();else show()}
    const ctx={q,body,item:it,oneShot:!!opt.oneShot,after:null,
      noCheck(){bC.hidden=true},
      onCheck(fn){checkFn=fn},
      onReveal(fn){revealFn=fn},
      say(m){say('info',m)},
      right(msg,pts){if(resolved)return;const mx=it.max||10;const p=pts??(tries===0?mx:tries===1?Math.round(mx/2):Math.round(mx/5));
        G.live+=p;drawBar();say('ok',(msg||pick(RIGHT))+(p?` +${p} puan`:''));settle(tries===0?'good':'late')},
      wrong(msg){if(resolved)return;tries++;
        host.querySelector('.body').classList.remove('shake');void body.offsetWidth;body.classList.add('shake');
        say('no',msg||'Bir daha dene.');
        if(opt.oneShot){revealFn&&revealFn();settle('late');return}
        if(tries>=2&&revealFn)bR.hidden=false},
      tries:()=>tries};
    bC.onclick=()=>{if(!resolved&&checkFn)checkFn()};
    bR.onclick=()=>{if(resolved)return;revealFn&&revealFn();say('info','Cevap gösterildi. Bu soru puan vermedi.');settle('late')};
    bN.onclick=advance;
    render(ctx,it,i);
  }
  show();
  return {finish};
}
function endChapter(ch,host,score,max){
  timerStop();keyTarget=null;
  const ratio=max?score/max:0, st=ratio>=.9?3:ratio>=.6?2:1, t=G.acc;
  G.res[ch.id]={score,max,time:t,stars:st};G.playing=false;drawBar();
  const msg=ratio>=.9?'Harika iş çıkardın! Bu sayfanın ustası oldun.':ratio>=.6?'Çok iyi gidiyorsun. Bir tur daha yaparsan üç yıldız senin.':'Güzel bir başlangıç. Modellere yeniden bak ve bir daha dene, her turda daha iyi olacaksın.';
  host.innerHTML=`<div class="res"><img src="${SIMGE}" alt="MathPopWithRu simgesi"><h2>${ch.title} bitti</h2><div class="stars pop">${stars(st)}</div>
    <div class="resnum"><div><small>Puan</small><b>${score} / ${max}</b></div><div><small>Süre</small><b>${fmtT(t)}</b></div></div>
    <p class="msg">${msg}</p>
    <div class="acts"><button class="btn soft" id="rAgain">Tekrar oyna</button><button class="btn next" id="rNext">Sayfayı çevir</button></div></div>`;
  host.querySelector('#rAgain').onclick=()=>startChapter();
  host.querySelector('#rNext').onclick=()=>go(G.page+1,1);
}

/* ---------- Bileşenler ---------- */
function mc(ctx,opts,ans,fmt,cls=''){
  const w=document.createElement('div');w.className='opts '+cls;
  w.innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${fmt(o)}</button>`).join('');
  ctx.body.appendChild(w);
  let over=false;
  const reveal=()=>{over=true;w.children[ans].classList.add('good')};
  w.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled||over)return;
    if(+b.dataset.i===ans){over=true;b.classList.add('good');ctx.right()}
    else{b.classList.add('bad');b.disabled=true;ctx.wrong(ctx.oneShot?'Doğru cevabı incele.':'Bu değil. Modele tekrar bak.')}});
  ctx.noCheck();ctx.onReveal(reveal);
}
function pad(ctx,mode){
  const w=document.createElement('div');w.className='pad';
  w.innerHTML=(mode==='frac'
    ?`<div class="fbox"><button class="slot act" data-s="n" aria-label="Pay"></button><span class="bar2"></span><button class="slot" data-s="d" aria-label="Payda"></button></div>`
    :`<div class="nbox"><button class="slot act" data-s="n" aria-label="Cevap"></button></div>`)
    +`<div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button class="del" data-k="del">Sil</button></div>`;
  const v={n:'',d:''};let a='n',lock=false;
  const slots=[...w.querySelectorAll('.slot')];

  }
  const p=pad(ctx,'num');

function rOps(ctx,t){
  const A=F(t.a,t.d),B=F(t.b,t.d);
  if(t.word){
    ctx.q.innerHTML=t.op==='+'?(t.a%2?`Ece pastanın ${fr(A)} kadarını, Can ${fr(B)} kadarını yedi. İkisi birlikte pastanın ne kadarını yedi?`:`Zeynep duvarın ${fr(A)} kadarını, Ali ${fr(B)} kadarını boyadı. Duvarın ne kadarı boyandı?`)
      :`Mert kitabının ${fr(A)} kadarını okumayı planladı, ${fr(B)} kadarını okudu. Planından geriye kitabın ne kadarı kaldı?`;
  }else ctx.q.innerHTML=`${fr(A)} ${t.op==='+'?'+':'−'} ${fr(B)} işlemini yap.`;
  const c1=COLOR[t.d],fill={};
  if(t.op==='+'){for(let i=0;i<t.a;i++)fill[i]=c1;for(let i=t.a;i<t.a+t.b;i++)fill[i]='#C4DAF5'}
  else for(let i=0;i<t.a;i++)fill[i]=c1;

  ctx.body.innerHTML=`<div style="width:100%;display:flex;justify-content:center">${model('strip',t.d,fill,{cross})}</div>`;
  const p=pad(ctx,'frac');
  const R=F(t.r,t.d);
  ctx.onCheck(()=>{if(p.n==null||p.d==null){ctx.say('Pay ve paydayı doldur.');return}
    if(p.d===0){ctx.wrong('Payda sıfır olamaz.');return}

  ctx.onReveal(()=>{p.set(t.r,t.d);p.lock()});
}

function turnTwo(old,nw,dir){

}
function turnOne(old,nw,dir){
  const book=$('#book'),fx=div('fxp');fx.inert=true;fx.setAttribute('aria-hidden','true');
  const t=div('turn'),sh=div('shade');
  const moving=dir>0?old.V:nw.V;
  if(dir<0)fx.appendChild(old.V);
  t.appendChild(moving);t.appendChild(sh);fx.appendChild(t);book.appendChild(fx);
  const ks=(c,v)=>{const x=c.querySelector('.scroll');if(x)x.scrollTop=v};
  ks(old.V,old.Vs);
  const D=600,opt={duration:D,easing:EASE,fill:'forwards'};
  const A={transform:'rotateY(0deg) skewY(0deg)'},M={transform:'rotateY(-62deg) skewY(1.6deg)',offset:dir>0?.55:.45},Z={transform:'rotateY(-118deg) skewY(0deg)'};
  const anim=t.animate(dir>0?[A,M,Z]:[Z,M,A],opt);
  sh.animate(dir>0?[{opacity:0},{opacity:.4}]:[{opacity:.4},{opacity:0}],opt);
  let over=false;
  const end=()=>{if(over)return;over=true;fx.remove();G.turnEnd=null};
  G.turnEnd=()=>{anim.cancel();end()};
  anim.onfinish=end;
}
function updateFoot(){
  const i=G.page,two=isTwo();
  $('#prev').disabled=i===0;
  $('#next').disabled=i===PAGES.length-1&&(two||G.side==='R');
  $('#pageNo').textContent=i===0?'Kapak':two?`Sayfa ${2*i}–${2*i+1}`:`Sayfa ${2*i+(G.side==='R'?1:0)}`;
}
function go(i,dir,side){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  if(G.turnEnd)G.turnEnd();
  const animate=dir&&i!==G.page&&!calm();
  const old=animate?snapshot():null;
  clearManaged();keyTarget=null;G.running=false;G.acc=0;G.playing=false;G.live=0;G.started=false;
  G.page=i;const p=PAGES[i],b=$('#book');
  G.side=p.kind==='cover'?'R':(side||'L');b.dataset.side=G.side;
  if(p.kind==='cover')renderCover();else if(p.kind==='toc')renderToc();else if(p.kind==='report')renderReport();else renderChapter(p,i);
  b.classList.toggle('closed',p.kind==='cover');
  window.scrollTo(0,0);document.body.scrollTop=0;
  if(old){const nw=snapshot();if(nw){if(isTwo())turnTwo(old,nw,dir);else turnOne(old,nw,dir)}}
  drawBar();updateFoot();
  try{if(location.hash.slice(1)!==p.id)location.hash=p.id}catch(e){}
}
function flipSide(to,dir){
  if(G.turnEnd)G.turnEnd();
  const b=$('#book'),old=calm()?null:snapshot();
  G.side=to;b.dataset.side=to;
  const p=PAGES[G.page];
  if(!p.kind){
    if(to==='R'){if(!G.started)startChapter();else if(G.playing){G.t0=Date.now();G.running=true}}
    else if(G.running){G.acc=elapsed();G.running=false}
  }
  if(old){const nw=snapshot();if(nw)turnOne(old,nw,dir)}
  drawBar();updateFoot();
}
function step(dir){
  if(isTwo()){go(G.page+dir,dir);return}
  const p=PAGES[G.page];
  if(dir>0){
    if(p.kind==='cover')go(1,1,'L');
    else if(G.side==='L')flipSide('R',1);
    else if(G.page<PAGES.length-1)go(G.page+1,1,'L');
  }else{
    if(p.kind==='cover')return;
    if(G.side==='R')flipSide('L',-1);
    else go(G.page-1,-1,'R');
  }
}
TWO_Q.addEventListener('change',()=>{
  const p=PAGES[G.page],b=$('#book');
  if(isTwo()){if(!p.kind&&!G.started)startChapter()}
  else{G.side=p.kind==='cover'?'R':(!p.kind&&G.started?'R':'L');b.dataset.side=G.side}
  updateFoot();
});
(function swipe(){
  let st=null;
  const skip=t=>t.closest&&t.closest('.match,.seg,.keys,.steps');
  document.addEventListener('touchstart',e=>{st=(e.touches.length===1&&!skip(e.target)&&e.target.closest('#book'))?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}:null},{passive:true});
  document.addEventListener('touchend',e=>{if(!st)return;const c=e.changedTouches[0],dx=c.clientX-st.x,dy=c.clientY-st.y,dt=Date.now()-st.t;st=null;
    if(isTwo()||Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||dt>700)return;step(dx<0?1:-1)},{passive:true});
})();
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('[data-turn]');if(c)step(+c.dataset.turn)});
function openDrawer(){const d=$('#drawer');
  d.innerHTML=`<div class="dh"><h2>İçindekiler</h2><button class="x" id="dx" aria-label="Kapat">×</button></div><div><div class="eyebrow">Seviye</div><div class="seg" role="group" aria-label="Seviye">${segHTML()}</div></div>
   <button class="tocb" data-go="0"><span class="pg">1</span><span class="tt">Kapak</span></button>${tocHTML()}<button class="tocb" data-go="${PAGES.length-1}"><span class="pg">${PAGES.length}</span><span class="tt">Kitap Karnem</span></button>`;
  bindSeg(d);d.onclick=tocClick;$('#dx').onclick=closeDrawer;d.hidden=false;$('#scrim').hidden=false}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true}
$('#menuBtn').onclick=openDrawer;$('#scrim').onclick=closeDrawer;
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeDrawer();return}
  if(/^[0-9]$/.test(e.key)&&keyTarget){e.preventDefault();keyTarget(e.key)}
  else if(e.key==='Backspace'&&keyTarget){e.preventDefault();keyTarget('del')}
  else if(e.key==='Enter'){const n=document.querySelector('#btnNext:not([hidden])'),c=document.querySelector('#btnCheck:not([hidden])');const t=n||c;if(t&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.part,.hit,.mi,.opt,.mc,.sc,.ss,.keys,.slot,.grp,.again'))){e.preventDefault();t.click()}}
});
function fromHash(){const id=location.hash.slice(1),i=PAGES.findIndex(p=>p.id===id);if(i>=0&&i!==G.page)go(i,i>G.page?1:-1,'L')}
window.addEventListener('hashchange',fromHash);
(function boot(){const id=location.hash.slice(1),i=PAGES.findIndex(p=>p.id===id);go(i>=0?i:0,0)})();
</script>
