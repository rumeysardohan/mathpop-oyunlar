<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Açı Kaçış Odası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="5. sınıflar için dokunmatik açı kaçış oyunu: ters açılar, komşu bütünler ve dik kesişim.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Düzen: sabit simge bandı (sol üst) + lavanta zemin üzerinde beyaz kartlar; oyun sahnesi indigo. Tek, bilinçli açık tema (marka). */
:root{
  --indigo:#2B17B0; --indigo-deep:#1B0C7A; --indigo-soft:#5A47D6;
  --lavender:#EEE8FF; --lavender-2:#DED4FF; --white:#FFFFFF;
  --teal:#1CC8D8; --teal-ink:#06707A; --teal-tint:#E2F9FB;
  --coral:#F47A5E; --coral-ink:#A33A20; --coral-tint:#FEEDE7;
  --ink:#1E1466; --muted:#6A62A3; --line:#DDD5FA;
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:20px; --shadow:0 10px 30px rgba(43,23,176,.12);
  --bar:88px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--lavender)}
body{margin:0;font-family:var(--font-body);color:var(--ink);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:450;background:var(--lavender)}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;min-height:52px;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
a{color:var(--indigo);font-weight:800}
p{margin:0 0 14px}
h1,h2,h3{font-family:var(--font-display);margin:0 0 12px;line-height:1.1;text-wrap:balance;color:var(--indigo)}
h1{font-size:clamp(42px,6vw,76px);font-weight:800}
h2{font-size:clamp(26px,3.2vw,40px);font-weight:800}
h3{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.55}
.eyebrow{font-size:12px;letter-spacing:1.6px;font-weight:900;text-transform:uppercase;color:var(--indigo-soft)}

/* Sabit simge — her ekranda sol üstte, modalların da üstünde */
.brand-badge{position:fixed;z-index:500;top:calc(12px + env(safe-area-inset-top,0px));left:calc(max(16px,env(safe-area-inset-left,0px)));display:flex;align-items:center;gap:8px;pointer-events:none}
.brand-badge img{width:64px;height:64px;border-radius:50%;border:3px solid var(--white);box-shadow:0 4px 14px rgba(43,23,176,.3);background:var(--white);display:block}
.brand-badge span{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--indigo);background:var(--white);padding:3px 10px;border-radius:99px;box-shadow:0 2px 8px rgba(43,23,176,.15)}

/* Üst bant: simge için yer ayırır, içerik simgenin altına kaymaz */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:300;background:var(--lavender);min-height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:220px;max-width:1300px;margin:auto}
.header .title{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--indigo);background:none;padding:0;min-height:44px}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav button{background:var(--white);color:var(--indigo);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(43,23,176,.1)}
.nav button:hover{background:var(--lavender-2)}
.nav .lbl{margin-left:6px}
.wrap{max-width:1300px;margin:auto;padding-block:8px 40px}

.btn{background:var(--indigo);color:var(--white);padding:14px 24px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;min-height:56px;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 var(--indigo-deep)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--indigo-deep)}
.btn.teal{background:var(--teal);color:var(--indigo-deep);box-shadow:0 6px 0 #0E97A4}
.btn.coral{background:var(--coral);color:var(--indigo-deep);box-shadow:0 6px 0 #C9553B}
.btn.light{background:var(--white);color:var(--indigo);box-shadow:0 6px 0 var(--lavender-2)}
.btn.outline{background:transparent;color:var(--indigo);border:3px solid var(--indigo);box-shadow:none}
.btn.danger{background:var(--coral-tint);color:var(--coral-ink);box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin:22px 0 12px}

.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
.card.indigo{background:var(--indigo);color:var(--white)}
.card.indigo h2,.card.indigo h3{color:var(--white)}
.card.indigo .muted{color:#CFC6FF}
.badge{display:inline-block;padding:7px 14px;border-radius:99px;background:var(--lavender);color:var(--indigo);font-size:14px;font-weight:900}
.note{padding:16px;background:var(--lavender);border-radius:14px;font-size:16px;margin:14px 0}
.card.indigo .note{background:rgba(255,255,255,.1)}

/* Ana sayfa */
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;padding-block:10px 20px}
.hero>div{min-width:0}
.hero h1 span{color:var(--coral)}
.hero p{font-size:19px;color:var(--muted);max-width:460px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--white);color:var(--indigo);border-radius:99px;padding:8px 14px;font-weight:900;font-size:13px;letter-spacing:1px;margin-bottom:18px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.hero-notes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero-notes span{background:var(--white);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--indigo)}
.poster{position:relative;border-radius:28px;overflow:hidden;background:var(--indigo);box-shadow:0 20px 50px rgba(43,23,176,.3);aspect-ratio:1.1;max-width:100%}
.poster svg,.room-scene svg{display:block;width:100%;height:100%}
.poster-bottom{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 10px}
.poster-bottom span{background:var(--white);color:var(--indigo);border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.step{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.step .num{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--teal);color:var(--indigo-deep);font-family:var(--font-display);font-weight:800;font-size:20px;margin-bottom:10px}
.step p{color:var(--muted);margin:0;font-size:16px}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-top:26px}

/* Kurulum ve sayfalar */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:18px}
label{font-weight:900;display:block;margin-bottom:7px;font-size:16px}
input,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);color:var(--ink);min-height:54px;font-size:17px}
input:focus,select:focus{border-color:var(--indigo);outline:none}
input[type=checkbox]{width:24px;height:24px;min-height:24px;accent-color:var(--indigo)}
.check{display:flex;gap:12px;align-items:center;font-size:17px;margin-bottom:12px}

/* Oda */
.room-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
.room-header>div:first-child{min-width:0}
.room-header h2{margin:2px 0 0}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock,.scorebox{background:var(--indigo);color:var(--white);border-radius:16px;padding:10px 16px;font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.clock small,.scorebox small{font-family:var(--font-body);font-size:11px;letter-spacing:1.4px;font-weight:900;opacity:.8}
.scorebox{background:var(--teal);color:var(--indigo-deep)}
.clock.urgent{background:var(--coral);color:var(--indigo-deep)}
.icon-btn{background:var(--white);color:var(--indigo);border-radius:14px;min-width:56px;min-height:56px;font-weight:900;font-size:20px;box-shadow:0 2px 8px rgba(43,23,176,.12)}
.room-layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.room-layout>*{min-width:0}
.room-scene{position:relative;border-radius:26px;overflow:hidden;background:var(--indigo);aspect-ratio:1.3;max-width:100%;box-shadow:0 14px 34px rgba(43,23,176,.25)}
.scene-tag{position:absolute;top:16px;left:18px;color:#CFC6FF;font-size:12px;letter-spacing:1.6px;font-weight:900}
.hotspot{position:absolute;min-height:62px;padding:10px 14px;border-radius:16px;background:var(--white);border:3px solid var(--white);color:var(--indigo);font-weight:900;font-size:17px;box-shadow:0 6px 20px rgba(10,4,60,.4);display:flex;gap:10px;align-items:center;text-align:left;max-width:44%;transition:transform .2s}
.hotspot:hover{transform:translateY(-3px)}
.hotspot .sym{font-size:26px;color:var(--coral);line-height:1}
.hotspot small{display:block;font-weight:700;font-size:13px;color:var(--muted)}
.hotspot.solved{background:var(--teal-tint);border-color:var(--teal)}
.hotspot.solved .sym{color:var(--teal-ink)}
.hotspot0{left:5%;top:30%}.hotspot1{right:4%;top:44%}.hotspot2{left:6%;bottom:7%}
.door-hotspot{position:absolute;left:44%;bottom:10%;min-height:56px;padding:10px 18px;border-radius:16px;background:var(--coral);color:var(--indigo-deep);font-weight:900;font-size:17px;box-shadow:0 6px 20px rgba(10,4,60,.4);max-width:48%}
.door-hotspot.open{background:var(--teal);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(28,200,216,.35)}}
.room-path{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.room-path span{padding:8px 12px;border-radius:12px;background:var(--white);color:var(--muted);font-weight:800;font-size:14px}
.room-path span.current{background:var(--indigo);color:var(--white)}
.room-path span.done{background:var(--teal-tint);color:var(--teal-ink)}
.turn{background:var(--indigo);color:var(--white);border-radius:16px;padding:16px;margin-bottom:12px}
.turn .eyebrow{color:var(--teal)}
.turn strong{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.team-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid var(--lavender);font-size:16px}
.team-row span{overflow-wrap:anywhere}
.team-row.active{font-weight:900;color:var(--indigo)}
.team-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.clue{border-radius:14px;padding:10px 4px;text-align:center;background:var(--lavender)}
.clue.found{background:var(--teal-tint);box-shadow:inset 0 0 0 2px var(--teal)}
.clue .symbol{font-size:22px;color:var(--coral);display:block}
.clue .digit{font-family:var(--font-display);font-size:32px;font-weight:800;display:block;color:var(--indigo);line-height:1.2}
.clue small{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.5px}
.code-order{padding:12px;border:2px dashed var(--lavender-2);border-radius:14px;font-size:15px}
.progress{height:10px;background:var(--lavender);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--teal);transition:width .3s}

/* Modal katmanı — üst 92px boş, simge örtmesin */
.overlay{position:fixed;inset:0;z-index:400;background:rgba(27,12,122,.82);display:flex;justify-content:center;align-items:flex-start;
  padding:calc(var(--bar) + 6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.dialog{background:var(--white);color:var(--ink);border-radius:24px;width:100%;max-width:1000px;box-shadow:0 30px 90px rgba(0,0,0,.35);margin-bottom:12px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:2px solid var(--lavender)}
.modal-top h3{margin:2px 0 0}
.modal-body{padding:22px}
.center{text-align:center}
.big-emoji{font-size:64px;line-height:1.1;margin-bottom:8px}
.puzzle-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.puzzle-layout>*{min-width:0}
.puzzle-question h2{font-size:clamp(22px,2.6vw,30px);line-height:1.25}
.diagram{display:block;width:100%;max-height:360px;user-select:none}
.diagram text{font-family:var(--font-display);pointer-events:none}
.sector{cursor:pointer}
.sector:hover{fill-opacity:.8}
.pair-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pair-buttons button{background:var(--lavender);border:3px solid transparent;color:var(--indigo);border-radius:14px;font-family:var(--font-display);font-weight:800;font-size:24px;min-height:58px}
.pair-buttons button.selected{border-color:var(--indigo);background:var(--white)}
.pair-buttons button.matched{background:var(--teal);color:var(--indigo-deep)}
.options{display:grid;gap:10px;margin:14px 0}
.option{background:var(--lavender);border:3px solid transparent;border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;font-size:17px;line-height:1.45;color:var(--ink);min-height:64px}
.option:hover{border-color:var(--indigo-soft)}
.option.correct{background:var(--teal-tint);border-color:var(--teal)}
.option.wrong{background:var(--coral-tint);border-color:var(--coral)}
.answer-entry{position:relative;margin-top:12px}
.answer-entry input{font-family:var(--font-display);font-size:34px;font-weight:800;text-align:center;letter-spacing:4px;min-height:66px;background:var(--lavender);border-color:var(--lavender-2);padding-right:48px}
.answer-entry span{position:absolute;right:18px;top:12px;font-size:30px;font-weight:900;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.keypad button{font-family:var(--font-display);font-size:26px;font-weight:800;background:var(--lavender);color:var(--indigo);border-radius:14px;min-height:56px}
.keypad button:hover{background:var(--lavender-2)}
.feedback{border-radius:16px;padding:16px;margin:14px 0;font-size:16px;background:var(--teal-tint);border:3px solid var(--teal)}
.feedback.bad{background:var(--coral-tint);border-color:var(--coral)}
.feedback strong{display:block;font-family:var(--font-display);font-size:22px;color:var(--teal-ink);margin-bottom:4px}
.feedback.bad strong{color:var(--coral-ink)}
.seal{display:inline-block;background:var(--white);border-radius:12px;padding:6px 14px;font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--indigo);margin-top:8px}
.hint{padding:12px 14px;border-left:5px solid var(--coral);background:var(--coral-tint);border-radius:0 12px 12px 0;margin:12px 0;font-size:16px}
.hint-btn{background:var(--white);color:var(--coral-ink);border:2px solid var(--coral);border-radius:14px;padding:8px 14px;font-weight:900;font-size:15px}
.lock-layout{display:grid;grid-template-columns:.85fr 1fr;gap:28px;align-items:center}
.lock-layout>*{min-width:0}
.lock-illustration{background:var(--indigo);color:var(--white);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lock-illustration .big{font-size:76px;line-height:1.1}
.lock-illustration .locks{display:flex;gap:8px;font-size:30px;margin-top:10px}
.lock-illustration .locks span{background:rgba(255,255,255,.12);border-radius:12px;padding:6px 14px;color:var(--teal)}
.lock-illustration p{font-size:13px;font-weight:900;letter-spacing:1px;margin:10px 0 0;color:#CFC6FF}

/* Sonuç */
.result-icon{width:110px;height:110px;border-radius:50%;border:5px solid var(--teal);display:block;margin:0 auto 10px}
.cheer{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3vw,30px);color:var(--coral);margin:4px 0 10px}
.result-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.result-metrics div{background:var(--lavender);border-radius:16px;padding:14px 8px;text-align:center}
.result-metrics strong{display:block;font-family:var(--font-display);font-size:34px;color:var(--indigo);line-height:1.1;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;white-space:nowrap}
th{text-align:left;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 12px}
td{padding:14px 12px;border-top:2px solid var(--lavender);font-variant-numeric:tabular-nums}
tbody tr:first-child td{background:var(--teal-tint)}
.review{border-top:2px solid var(--lavender);padding:14px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92%;background:var(--indigo);color:var(--white);z-index:600;padding:14px 22px;border-radius:16px;font-weight:800;box-shadow:var(--shadow)}
.confetti{position:fixed;top:-20px;z-index:550;pointer-events:none;width:11px;height:18px;border-radius:3px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:0}}

/* Akıllı tahta */
@media(min-width:1500px){
  .big-mode{font-size:19px}
  .big-mode .wrap,.big-mode .header{max-width:1520px}
  .big-mode .dialog{max-width:1200px}
  .big-mode .diagram{max-height:460px}
  .big-mode .option{font-size:22px;min-height:80px}
  .big-mode .keypad button{min-height:72px;font-size:32px}
  .big-mode .hotspot{font-size:20px;min-height:74px}
  .big-mode .clock,.big-mode .scorebox{font-size:36px}
}
@media(max-width:980px){
  .room-layout{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .room-scene{aspect-ratio:1.1}
}
@media(max-width:760px){
  .header{padding-left:88px}
  .header .title{font-size:20px}
  .nav .lbl{display:none}
  .nav button{min-width:52px}
  .brand-badge span{display:none}
  .hero{grid-template-columns:1fr;gap:22px}
  .hero h1{font-size:46px}
  .steps{grid-template-columns:1fr}
  .two{grid-template-columns:1fr;gap:0}
  .room-header{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:200;background:var(--lavender);padding-block:8px;margin-bottom:10px}
  .room-header h2{font-size:24px}
  .clock,.scorebox{font-size:22px;padding:8px 12px}
  .room-scene{aspect-ratio:.9}
  .hotspot{font-size:14px;padding:8px 10px;max-width:47%;min-height:56px}
  .hotspot small{font-size:11px}
  .hotspot .sym{font-size:20px}
  .hotspot0{left:3%;top:24%}.hotspot1{right:3%;top:46%}.hotspot2{left:3%;bottom:8%}
  .door-hotspot{left:auto;right:3%;bottom:8%;font-size:14px;padding:10px 12px}
  .puzzle-layout,.lock-layout{grid-template-columns:1fr;gap:6px}
  .puzzle-left{order:2}.puzzle-right{order:1}
  .diagram{max-height:240px}
  .modal-body{padding:16px}
  .modal-top{padding:12px 16px}
  .result-metrics{grid-template-columns:repeat(2,1fr)}
  .actions .btn{flex-grow:1}
  .lock-illustration{padding:14px}

function clockLabel(){return run.config.minutes===0||run.continued?'∞':timeText(run.remaining)}
function updateClock(){let e=$('#clockVal');if(e){e.textContent=clockLabel();$('#clock').classList.toggle('urgent',!run.continued&&run.config.minutes>0&&run.remaining<=60)}let m=$('#modalClock');if(m)m.textContent='⏱ '+clockLabel()}
function renderRoom(){newPage('room');let r=run.rooms[run.room],found=r.tasks.filter(p=>p.solved).length,total=run.rooms.flatMap(r=>r.tasks).filter(p=>p.solved).length;app.innerHTML=`<div class="room-header"><div><span class="eyebrow">${run.room+1}. oda / 3 · ${r.tag}</span><h2>${r.name}</h2></div><div class="hud"><div class="scorebox" aria-label="Sıradaki takımın puanı"><small>PUAN</small><span>${team().score}</span></div><div id="clock" class="clock" aria-label="Kalan süre"><small>SÜRE</small><span id="clockVal">${clockLabel()}</span></div><button class="icon-btn" onclick="pauseGame()" aria-label="Oyunu duraklat">Ⅱ</button></div></div><div class="room-layout"><section><div class="room-scene"><span class="scene-tag">NESNELERE DOKUN · MÜHÜRLERİ BUL</span>${sceneSvg(run.room)}${r.tasks.map((p,i)=>`<button class="hotspot hotspot${i} ${p.solved?'solved':''}" onclick="openPuzzle(${i})"><span class="sym">${p.solved?'✓':r.symbols[i]}</span><div>${r.objects[i]}<small>${p.solved?'Mühür bulundu':'Bulmacayı aç'}</small></div></button>`).join('')}<button class="door-hotspot ${found===3?'open':''}" onclick="openDoor()">${found===3?'🔑 Şifreyi gir':'🔒 Kapı'} ${found}/3</button></div><div class="room-path">${run.rooms.map((x,i)=>`<span class="${i===run.room?'current':i<run.room?'done':''}">${i<run.room?'✓':i+1} ${x.name}</span>`).join('')}</div></section><aside class="card"><div class="turn"><span class="eyebrow">Şimdi sıra sizde</span><strong>${esc(team().name)}</strong></div>${run.teams.map((t,i)=>`<div class="team-row ${i===run.turn?'active':''}"><span>${i===run.turn?'▸ ':''}${esc(t.name)}</span><b>${t.score} p</b></div>`).join('')}<div style="margin-top:18px"><span class="eyebrow">Ortak takım defteri</span><div class="clues">${clueCards(r)}</div><div class="code-order"><strong>Kapıdaki sembol sırası</strong><br><span style="font-size:26px;letter-spacing:4px;color:var(--coral)">${r.order.map(i=>r.symbols[i]).join(' → ')}</span><br><span class="small muted">Mühürlerin rakamlarını bu sırayla yaz.</span></div></div><div style="margin-top:18px"><div class="small muted" style="margin-bottom:6px">${total}/9 mühür · ${run.room}/3 kapı açık</div><div class="progress"><span style="width:${total/9*100}%"></span></div></div><p class="small muted" style="margin:14px 0 0">Görev +100 · Kapı +60 · Hata −15 · İpucu −10</p>${run.continued?'<div class="note small">Süre doldu. Süresiz devam ediyorsunuz.</div>':''}</aside></div>`;startClock();updateClock()}
function clueCards(r){return r.tasks.map((p,i)=>`<div class="clue ${p.solved?'found':''}"><span class="symbol">${r.symbols[i]}</span><span class="digit">${p.solved?p.digit:'?'}</span><small>${p.solved?'BULUNDU':'KİLİTLİ'}</small></div>`).join('')}
function point(rad,deg){let a=deg*Math.PI/180;return [220+rad*Math.cos(a),195+rad*Math.sin(a)]}
function diagram(p,opt={}){let rays=[p.rot,p.rot+p.theta,p.rot+180,p.rot+180+p.theta],v=[p.theta,180-p.theta,p.theta,180-p.theta],cols=['#8C7BFF','#F47A5E','#66A8FF','#FF8FC7'];let wedges=rays.map((a,i)=>{let b=i===3?p.rot+360:rays[i+1],x=point(98,a),y=point(98,b),m=point(140,(a+b)/2),d=point(70,(a+b)/2),sel=pairSelection.includes(i),done=matched.includes(i);return `<path d="M220 195L${x}A98 98 0 0 1 ${y}Z" fill="${done?'#1CC8D8':cols[i]}" fill-opacity="${sel||done?.9:.45}" stroke="${sel?'#2B17B0':'#FFFFFF'}" stroke-width="${sel?5:2}" ${opt.interactive?`class="sector" role="button" tabindex="0" aria-label="${'ABCD'[i]} açısını seç" onclick="selectSector(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectSector(${i})}"`:''}/><text x="${m[0]}" y="${m[1]}" font-size="26" font-weight="800" fill="#2B17B0" text-anchor="middle" dominant-baseline="middle">${'ABCD'[i]}${done?'✓':''}</text>${opt.reveal||p.kind!=='pair'&&p.known===i?`<text x="${d[0]}" y="${d[1]}" font-size="20" font-weight="800" fill="#1E1466" text-anchor="middle" dominant-baseline="middle">${v[i]}°</text>`:p.kind==='numeric'&&p.target===i?`<text x="${d[0]}" y="${d[1]}" font-size="28" font-weight="800" fill="#1E1466" text-anchor="middle" dominant-baseline="middle">?</text>`:''}`}).join('');let lines=rays.slice(0,2).map(a=>`<path d="M${point(190,a)}L${point(190,a+180)}" stroke="#2B17B0" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>`).join('');return `<svg class="diagram" viewBox="0 0 440 390" role="group" aria-label="O noktasında kesişen iki doğru ve A, B, C, D açıları"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M1 1L5 3 1 5" fill="none" stroke="#2B17B0" stroke-width="1.3"/></marker></defs><circle cx="220" cy="195" r="172" fill="#EEE8FF"/>${wedges}${lines}<circle cx="220" cy="195" r="5" fill="#2B17B0"/><rect x="207" y="208" width="26" height="24" rx="6" fill="#FFFFFF"/><text x="220" y="226" text-anchor="middle" font-size="16" font-weight="800" fill="#2B17B0">O</text></svg>`}
function puzzle(){return run.rooms[run.room].tasks[activePuzzle]}
function puzzleHeader(title){return `<div class="modal-top"><div style="min-width:0"><span class="eyebrow">${esc(team().name)} · ${title}</span><h3>${run.rooms[run.room].objects[activePuzzle]}</h3></div><div style="display:flex;align-items:center;gap:10px"><span id="modalClock" class="badge">⏱ ${clockLabel()}</span><button class="icon-btn" onclick="leavePuzzle()" aria-label="Bulmacayı kapat">✕</button></div></div>`}
function openPuzzle(i){if(paused||run.finished)return;activePuzzle=i;pairSelection=[];matched=[];inputValue='';feedbackMode=false;let p=puzzle();if(p.solved){paused=true;showModal('solved',puzzleHeader('Mühür defteri')+`<div class="modal-body"><div class="feedback"><strong>Bu mühür zaten bulundu.</strong>${p.explain}<br><span class="seal">${run.rooms[run.room].symbols[i]} = ${p.digit}</span></div><button class="btn" onclick="leavePuzzle()">Odaya dön</button></div>`);return}renderPuzzle()}
function renderPuzzle(){let p=puzzle(),hintKey=run.room+'-'+activePuzzle+'-'+run.turn;showModal('puzzle',puzzleHeader(p.topic)+`<div class="modal-body"><div class="puzzle-layout"><div class="puzzle-left"><div id="diagramHost">${diagram(p,{interactive:p.kind==='pair'})}</div>${p.kind==='pair'?`<div class="pair-buttons" id="pairButtons">${pairButtons()}</div><p class="small muted" id="pairProgress">${p.pairType==='opposite'?'İki ters açı çifti bulunmalı.':'Bir komşu bütünler çifti seç.'}</p>`:''}<p class="small muted center">Çizimin yönü açı ilişkisini değiştirmez.</p></div><div class="puzzle-right"><div class="puzzle-question"><span class="eyebrow">${run.room+1}. oda · ${activePuzzle+1}. mühür</span><h2 style="margin-top:8px">${p.prompt}</h2></div><div class="answer-area">${p.kind==='numeric'?`<form onsubmit="event.preventDefault();submitNumber()"><div class="answer-entry"><input id="numberInput" type="text" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Açının ölçüsü (derece)" oninput="inputValue=this.value.replace(/[^0-9]/g,'').slice(0,3);this.value=inputValue" value=""><span>°</span></div>${keypad()}<button class="btn" style="width:100%" type="submit">Ölçüyü kontrol et ✓</button></form>`:p.kind==='reason'?`<div class="options">${p.options.map((s,i)=>`<button class="option" data-i="${i}" onclick="submitReason(${i})">${s}</button>`).join('')}</div>`:'<div class="note">Şekildeki açı bölgelerine ya da A, B, C, D düğmelerine dokun. Seçtiğin iki açı bir çift oluşturur.</div>'}<div id="puzzleFeedback" aria-live="polite"></div><div id="puzzleAction"></div></div><div class="helper-area"><div id="hintHost">${run.hints[hintKey]?'<div class="hint">'+p.hint+'</div>':''}</div><button class="hint-btn" id="hintButton" onclick="useHint()">${run.hints[hintKey]?'İpucu açık':'💡 İpucu al (−10 puan)'}</button></div></div></div></div>`)}
function pairButtons(){return [0,1,2,3].map(i=>`<button class="${pairSelection.includes(i)?'selected':''} ${matched.includes(i)?'matched':''}" ${matched.includes(i)||feedbackMode?'disabled':''} onclick="selectSector(${i})" aria-label="${'ABCD'[i]} açısı">${'ABCD'[i]}${matched.includes(i)?' ✓':''}</button>`).join('')}
function keypad(){return `<div class="keypad" aria-label="Sayı tuşları">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button type="button" onclick="keyPress('${k}')" aria-label="${k==='C'?'Temizle':k==='⌫'?'Son rakamı sil':k}">${k}</button>`).join('')}</div>`}
function keyPress(k){if(feedbackMode)return;inputValue=k==='C'?'':k==='⌫'?inputValue.slice(0,-1):(inputValue+k).slice(0,3);let e=$('#numberInput')||$('#codeInput');if(e)e.value=inputValue}
function validPair(a,b,kind){return a!==b&&(kind==='opposite'?Math.abs(a-b)===2:Math.abs(a-b)===1||Math.abs(a-b)===3)}
function selectSector(i){if(modalKind!=='puzzle'||feedbackMode||matched.includes(i))return;let p=puzzle();if(p.kind!=='pair')return;if(pairSelection.includes(i))pairSelection=[];else pairSelection.push(i);if(pairSelection.length===2){let good=validPair(pairSelection[0],pairSelection[1],p.pairType);if(!good){wrongAnswer('Bu iki açı aranan ilişkiyi oluşturmuyor.',p.hint);return}matched.push(...pairSelection);pairSelection=[];if(p.pairType==='adjacent'||matched.length===4){solvePuzzle();return}chime();$('#pairProgress').textContent='İlk çift doğru! Kalan iki açıyı eşleştir.'}$('#diagramHost').innerHTML=diagram(p,{interactive:true});$('#pairButtons').innerHTML=pairButtons()}
function submitNumber(){if(feedbackMode)return;if(inputValue===''){toast('Önce bir ölçü yaz.');return}let p=puzzle();if(Number(inputValue)===p.answer)solvePuzzle();else wrongAnswer('Bu ölçü kilidi açmadı.',p.hint)}
function submitReason(i){if(feedbackMode)return;let p=puzzle(),btn=document.querySelector(`.option[data-i="${i}"]`);if(p.options[i]===p.answer){btn?.classList.add('correct');solvePuzzle()}else{btn?.classList.add('wrong');wrongAnswer('Gerekçeyi yeniden inceleyelim.',p.hint)}}
function freezeAnswers(){document.querySelectorAll('.answer-area form button,.options button,.pair-buttons button,.keypad button').forEach(b=>b.disabled=true);$('#numberInput')?.setAttribute('disabled','');$('#hintButton')?.setAttribute('disabled','')}
function wrongAnswer(title,detail){if(feedbackMode)return;feedbackMode=true;paused=true;team().score-=15;team().errors++;run.pendingTurn=true;saveRun();chime(false);freezeAnswers();$('#puzzleFeedback').innerHTML=`<div class="feedback bad"><strong>${title} −15 puan</strong>${detail}<br><span class="small">Açıklama sırasında süre durur.</span></div>`;$('#puzzleAction').innerHTML=`<button class="btn coral" onclick="passTurn()">${run.teams.length>1?'Sıradaki takıma geç ▶':'Yeniden dene ▶'}</button>`;$('#puzzleFeedback').scrollIntoView({block:'nearest'})}
function solvePuzzle(){if(feedbackMode||puzzle().solved)return;feedbackMode=true;paused=true;let p=puzzle();p.solved=true;team().score+=100;team().solved++;run.pendingTurn=true;saveRun();chime();freezeAnswers();if(p.kind==='pair'){$('#pairButtons').innerHTML=pairButtons();$('#pairProgress').textContent=p.pairType==='opposite'?'İki ters açı çifti de bulundu ✓':'Komşu bütünler çifti bulundu ✓'}$('#diagramHost').innerHTML=diagram(p,{reveal:true});$('#puzzleFeedback').innerHTML=`<div class="feedback"><strong>Mühür açıldı! +100 puan</strong>${p.explain}<br><span class="seal">${run.rooms[run.room].symbols[activePuzzle]} = ${p.digit}</span><br><span class="small">Şifre parçası takım defterine eklendi.</span></div>`;$('#puzzleAction').innerHTML='<button class="btn teal" onclick="passTurn()">Mührü al, odaya dön ▶</button>';$('#puzzleFeedback').scrollIntoView({block:'nearest'});confetti()}
function passTurn(){if(!feedbackMode)return;closeModal();feedbackMode=false;nextTeam();renderRoom();paused=false;lastTick=performance.now();toast('Sıra: '+team().name)}
function useHint(){if(feedbackMode||activePuzzle===null)return;let k=run.room+'-'+activePuzzle+'-'+run.turn;if(run.hints[k])return;run.hints[k]=true;team().score-=10;team().hints++;saveRun();$('#hintHost').innerHTML='<div class="hint">'+puzzle().hint+'</div>';$('#hintButton').textContent='İpucu açık';chime(false)}
function leavePuzzle(){if(feedbackMode){if(modalKind==='door'){doorRetry();return}passTurn();return}closeModal();activePuzzle=null;renderRoom();paused=false;lastTick=performance.now()}
function openDoor(){if(paused)return;let r=run.rooms[run.room];if(!r.tasks.every(p=>p.solved)){toast('Kapı için üç mühür gerekli. Kilitli nesnelere dokun.');return}inputValue='';feedbackMode=false;showModal('door',`<div class="modal-top"><div><span class="eyebrow">${esc(team().name)} · Kapının kilidi</span><h3>Üç haneli şifre</h3></div><div style="display:flex;gap:10px;align-items:center"><span id="modalClock" class="badge">⏱ ${clockLabel()}</span><button class="icon-btn" onclick="leavePuzzle()" aria-label="Kilidi kapat">✕</button></div></div><div class="modal-body"><div class="lock-layout"><div><div class="lock-illustration"><span class="big">🔑</span><div class="locks">${r.order.map(i=>'<span>'+r.symbols[i]+'</span>').join('')}</div><p>RAKAMLARI BU SEMBOL SIRASIYLA YAZ</p></div><div class="clues">${clueCards(r)}</div></div><div><h2>Mühürler tamam!</h2><p class="small muted">Defterdeki rakamları kapıdaki sembol sırasına göre dizin. İlk sembolün rakamı en başa yazılır.</p><form onsubmit="event.preventDefault();submitCode()"><div class="answer-entry"><input id="codeInput" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Üç haneli kapı şifresi" oninput="inputValue=this.value.replace(/[^0-9]/g,'').slice(0,3);this.value=inputValue"></div>${keypad()}<button class="btn coral" style="width:100%" type="submit">Kapıyı aç 🔑</button></form><div id="doorFeedback" aria-live="polite"></div></div></div></div>`)}
function submitCode(){if(feedbackMode)return;if(inputValue.length!==3){toast('Şifre üç rakamdan oluşmalı.');return}let r=run.rooms[run.room];if(r.opened)return;let expected=r.order.map(i=>r.tasks[i].digit).join('');if(inputValue!==expected){feedbackMode=true;paused=true;team().score-=15;team().errors++;run.pendingTurn=true;saveRun();chime(false);document.querySelectorAll('#modal form button').forEach(b=>b.disabled=true);$('#doorFeedback').innerHTML='<div class="feedback bad"><strong>Şifre uymadı. −15 puan</strong>Rakamları nesnelerin sırasıyla değil, kapıdaki sembol sırasıyla yazın.</div><button class="btn coral" onclick="doorRetry()">Sırayı devret ▶</button>';return}r.opened=true;team().score+=60;team().doors++;feedbackMode=true;paused=true;saveRun();chime();confetti();showModal('dooropen',`<div class="modal-body center" style="padding:36px"><div class="big-emoji">🔓</div><span class="badge">+60 puan · ${esc(team().name)}</span><h2 style="margin-top:14px">${run.room===2?'Son kapı açıldı!':'Kapı açıldı!'}</h2><p>${run.room===2?'Bütün şifreleri birlikte çözdünüz.':'Mühürler doğru sırada. Yeni oda sizi bekliyor.'}</p><button class="btn teal" onclick="nextRoom()">${run.room===2?'Sonuçları gör ▶':'Sonraki odaya geç ▶'}</button></div>`)}
function doorRetry(){if(!feedbackMode)return;closeModal();nextTeam();renderRoom();paused=false;feedbackMode=false;lastTick=performance.now()}
function nextRoom(){if(!run.rooms[run.room].opened)return;closeModal();feedbackMode=false;nextTeam();if(run.room===2){finish(true);return}run.room++;saveRun();renderRoom();roomIntro()}
function pauseGame(){if(!run||run.finished||isOpen())return;paused=true;saveRun();showModal('pause',`<div class="modal-body center" style="padding:34px"><div class="big-emoji">⏸</div><h2>Takım molası</h2><p>Süre durdu. Fikirlerinizi toparlayın.</p><div class="actions" style="justify-content:center"><button class="btn teal" onclick="resumeGame()">Devam et ▶</button><button class="btn light" onclick="replay()">↻ Tekrar oyna</button><button class="btn light" onclick="pauseToHome()">Kaydet ve ana sayfa</button></div></div>`)}
function resumeGame(){closeModal();renderRoom();paused=false;lastTick=performance.now()}
function pauseToHome(){closeModal();saveRun();run=null;home()}
function timeout(){paused=true;run.timedOut=true;saveRun();chime(false);showModal('timeout',`<div class="modal-body center" style="padding:34px"><div class="big-emoji">⌛</div><h2>Süre doldu!</h2><p>Bulduğunuz mühürler ve puanlar korunuyor.</p><div class="actions" style="justify-content:center"><button class="btn teal" onclick="continuePractice()">Süresiz devam et</button><button class="btn light" onclick="closeModal();finish(false)">Turu bitir</button></div></div>`)}
function continuePractice(){run.continued=true;saveRun();closeModal();feedbackMode=false;renderRoom();paused=false;lastTick=performance.now()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!run.finished&&page==='room'&&!isOpen()){pauseGame()}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!isOpen())return;if(['puzzle','solved','door'].includes(modalKind))leavePuzzle();else if(modalKind==='pause')resumeGame();else if(modalKind==='info')closeModal()});
function goHome(){if(run&&!run.finished&&page==='room'){if(isOpen())return;pauseGame();return}run=null;home()}
function finish(escaped){if(!run||run.finished)return;paused=true;stopClock();run.finished=true;run.escaped=escaped;run.finishedAt=new Date().toISOString();if(!records.some(r=>r.id===run.id)){records.push(structuredClone(run));persist('escape-records',records)}persist('escape-run',null);saved=null;closeModal();renderResult()}
function cheer(found,escaped){if(escaped&&found===9)return 'Harikasınız! Açıların sırrını tamamen çözdünüz. 🌟';if(escaped)return 'Süpersiniz! Takım çalışmasıyla çıkışı buldunuz.';if(found>=5)return 'Çok iyi gidiyordunuz! Bir tur daha, kapı sizi bekliyor.';if(found>=1)return 'Güzel başlangıç! Her hata yeni bir ipucu demek.';return 'Pes etmek yok! İpuçlarını kullanıp tekrar deneyin.'}
function renderResult(){newPage('result');let r=run,found=r.rooms.flatMap(x=>x.tasks).filter(p=>p.solved).length,best=Math.max(...r.teams.map(t=>t.score));app.innerHTML=`<section class="card" style="max-width:1000px;margin:6px auto"><div class="center"><img class="result-icon" src="${ICON}" alt="MathPopWithRu simgesi"><span class="eyebrow">Kaçış raporu · ${esc(r.config.className)}</span><h1 style="font-size:clamp(34px,5vw,56px);margin-top:6px">${r.escaped?'Çıkışı buldunuz!':'Tur bitti'}</h1><p class="cheer">${cheer(found,r.escaped)}</p><span class="badge">${r.timedOut?(r.continued?'Süre aşıldı · süresiz devam edildi':'Süre doldu'):r.config.minutes===0?'Süresiz keşif':'Süre içinde tamamlandı'}</span></div><div class="result-metrics"><div><strong>${best}</strong><span class="small">En yüksek puan</span></div><div><strong>${found}/9</strong><span class="small">Mühür</span></div><div><strong>${r.rooms.filter(x=>x.opened).length}/3</strong><span class="small">Kapı</span></div><div><strong>${timeText(r.elapsed)}</strong><span class="small">Süre</span></div></div><div class="actions" style="justify-content:center"><button class="btn coral" onclick="replay()">↻ Tekrar oyna</button><button class="btn light" onclick="review()">Çözümleri incele</button><button class="btn light" onclick="leaderboard()">🏆 Sınıf tablosu</button><button class="btn outline" onclick="run=null;setup()">Yeni ayarlar</button></div><h3 style="margin-top:20px">Takım sonuçları</h3><div class="table-wrap"><table><thead><tr><th>Takım</th><th>Puan</th><th>Mühür</th><th>Kapı</th><th>Hata</th><th>İpucu</th></tr></thead><tbody>${[...r.teams].sort((a,b)=>b.score-a.score||a.errors-b.errors).map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td><strong>${t.score}</strong></td><td>${t.solved}</td><td>${t.doors}</td><td>${t.errors}</td><td>${t.hints}</td></tr>`).join('')}</tbody></table></div><div class="note"><strong>Birlikte konuşalım:</strong><br>Ters açıların eşitliğini nerede kullandınız? Hangi görevde 180°’den çıkardınız? Çizimi döndürseydik çözüm değişir miydi?</div></section>`;if(r.escaped)confetti()}
function review(){if(!run)return;newPage('review');app.innerHTML=`<div class="head"><div><span class="eyebrow">Öğrenme defteri</span><h2>Kapıları açan ilişkiler</h2></div><div class="actions" style="margin:0"><button class="btn coral" onclick="replay()">↻ Tekrar oyna</button><button class="btn light" onclick="renderResult()">Rapora dön</button></div></div><section class="card">${run.rooms.map((r,ri)=>`<h3 style="margin-top:14px">${ri+1}. ${r.name}</h3>${r.tasks.map((p,i)=>`<div class="review"><span class="badge" style="${p.solved?'background:var(--teal-tint);color:var(--teal-ink)':'background:var(--coral-tint);color:var(--coral-ink)'}">${r.symbols[i]} ${r.objects[i]} · ${p.solved?'Çözüldü ✓':'Tekrar incele'}</span><p style="margin:10px 0 6px"><strong>${esc(p.prompt)}</strong></p><p class="muted" style="margin:0">${esc(p.explain)}</p></div>`).join('')}`).join('')}</section>`}
function leaderboard(group=groupKey(config)){if(run&&!run.finished&&page==='room'){toast('Sınıf tablosu için önce oyunu duraklatıp ana sayfaya dön.');return}newPage('leaderboard');let groups=[...new Set([group,...records.map(r=>groupKey(r.config))])];app.innerHTML=`<div class="head"><div><span class="eyebrow">Sınıfın kaçış günlüğü</span><h2>Liderlik tablosu</h2></div><button class="btn coral" onclick="run=null;setup()">Yeni tur ▶</button></div><section class="card"><div class="field"><label for="groupSelect">Sınıf ve senaryo</label><select id="groupSelect">${groups.map((g,i)=>{let c=JSON.parse(g);return `<option value="${i}" ${g===group?'selected':''}>${esc(c[0])} · ${esc(c[1])} · ${c[2]||'∞'} dk · ${c[3]} takım</option>`}).join('')}</select></div><div id="tableHost"></div><div class="actions"><button class="btn light" onclick="goHome()">Ana sayfa</button></div><p class="small muted" style="margin:0">Kayıtlar bu cihazın tarayıcısında tutulur.</p></section>`;$('#groupSelect').onchange=()=>drawTable(groups[Number($('#groupSelect').value)]);drawTable(group)}
function rankRows(group){return records.filter(r=>groupKey(r.config)===group).flatMap(r=>r.teams.map(t=>({...t,run:r}))).sort((a,b)=>Number(b.run.escaped&&!b.run.timedOut)-Number(a.run.escaped&&!a.run.timedOut)||b.score-a.score||a.errors-b.errors||a.run.elapsed-b.run.elapsed)}
function drawTable(group){let rows=rankRows(group);$('#tableHost').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Sıra</th><th>Takım</th><th>Durum</th><th>Puan</th><th>Mühür</th><th>Hata</th><th>Süre</th></tr></thead><tbody>${rows.map((t,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><strong>${esc(t.name)}</strong></td><td>${t.run.timedOut?'Süre aşıldı':t.run.escaped?'Kaçış başarılı':'Tamamlanmadı'}</td><td><strong>${t.score}</strong></td><td>${t.solved}</td><td>${t.errors}</td><td>${timeText(t.run.elapsed)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="big-emoji">🔑</div><h3>İlk kaçış ekibi bekleniyor</h3><p>Bir tur tamamlayın, takım sonuçları burada görünsün.</p></div>'}
function teacher(){if(run&&!run.finished&&page==='room'){toast('Ayarlar için önce oyunu duraklatıp ana sayfaya dön.');return}newPage('teacher');app.innerHTML=`<div class="head"><div><span class="eyebrow">Öğretmen rehberi</span><h2>Düşünmeye zaman aç</h2></div><button class="btn light" onclick="goHome()">Ana sayfa</button></div><div class="grid"><section class="card"><h3>Görünüm ve ses</h3><label class="check"><input type="checkbox" id="bigMode" ${config.big?'checked':''}> Akıllı tahta için büyük yazı ve düğmeler</label><label class="check"><input type="checkbox" id="soundMode" ${config.sound?'checked':''}> Kısa cevap sesleri</label><div class="actions"><button class="btn" onclick="saveSettings()">Tercihleri kaydet</button><button class="btn light" onclick="setup()">Takım ve süre ▶</button></div><div class="note"><strong>Önerilen akış</strong><br>Her takımda bir sözcü ve bir gerekçe sorumlusu olsun. Sözcü ekrana dokunsun, gerekçe sorumlusu çözümü açıklasın. Her odada rolleri değiştirin.</div><div id="clearBox"><button class="btn danger" onclick="askClear()">Tamamlanan sonuçları temizle</button></div></section><aside class="card"><h3>Öğrenme odağı</h3><p class="small">• Ters açılar eş ölçülüdür.<br>• Kesişen iki doğrunun oluşturduğu komşu açıların toplamı 180°’dir.<br>• Her komşu açı çifti bütünler olmak zorunda değildir.<br>• Dik kesişen doğrular dört dik açı oluşturur.<br>• Çizim döndürülünce açı ilişkileri korunur.</p><p class="small muted">MEB 5. sınıf, MAT.5.3.4: kesişen iki doğrunun oluşturduğu açılar.</p><p class="small"><a href="https://tymm.meb.gov.tr/7/unite/448?kod=MAB3" target="_blank" rel="noopener">MEB öğretim programı ↗</a></p></aside></div>`}
function saveSettings(){config.big=$('#bigMode').checked;config.sound=$('#soundMode').checked;persist('escape-config',config);document.body.classList.toggle('big-mode',config.big);toast('Tercihler kaydedildi.');chime()}
function askClear(){$('#clearBox').innerHTML='<p><strong>Bu cihazdaki tamamlanan turlar silinsin mi?</strong></p><div class="actions" style="margin-top:0"><button class="btn danger" onclick="records=[];persist(\'escape-records\',records);toast(\'Sonuçlar silindi.\');teacher()">Evet, sil</button><button class="btn light" onclick="teacher()">Vazgeç</button></div>'}
async function fullScreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Bu ekranda tam ekran açılamıyor; oyunu normal ekranda oynayabilirsin.')}}
home();
</script>
